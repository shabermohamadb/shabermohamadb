<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 160" width="100%" height="100%">
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace; }

      @keyframes spinPoly {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .spin-mesh { transform-origin: 75px 80px; animation: spinPoly 18s linear infinite; }
    </style>
  </defs>

  <rect width="940" height="160" fill="#f7f6f2" rx="4" stroke="#e5e3dc" stroke-width="1" />

  <!-- Left: 3D Wireframe Mesh Graphic -->
  <g transform="translate(24, 0)">
    <g class="spin-mesh">
      <polygon points="75,40 115,60 115,100 75,120 35,100 35,60" fill="none" stroke="#1d4ed8" stroke-width="1.4" />
      <line x1="75" y1="80" x2="75" y2="120" stroke="#71717a" stroke-width="1" />
      <line x1="75" y1="80" x2="115" y2="60" stroke="#71717a" stroke-width="1" />
      <line x1="75" y1="80" x2="35" y2="60" stroke="#71717a" stroke-width="1" />
      <circle cx="75" cy="80" r="3" fill="#18181b" />
    </g>
    <text x="75" y="142" text-anchor="middle" class="mono" font-size="7.5" fill="#71717a">THREE.JS // WEBGL SPATIAL</text>
  </g>

  <!-- Right: Project Editorial Content -->
  <g transform="translate(180, 26)">
    <text class="mono" font-size="9.5" font-weight="700" fill="#71717a" letter-spacing="1">PROJECT 03 // MULTIPLAYER 3D GAME</text>
    <text y="22" class="sans" font-size="18" font-weight="800" fill="#18181b">Hidden Number &#8212; Social Deduction in WebGL</text>
    <text y="42" class="sans" font-size="11.5" fill="#71717a">
      A 3D spatial multiplayer social deduction party game. Built with Three.js (WebGL) spatial depth, lighting shaders, and server-verified cryptographic number veils preventing client-side inspection.
    </text>

    <!-- Technical Badges -->
    <g transform="translate(0, 68)">
      <rect x="0" y="0" width="84" height="20" rx="2" fill="#ffffff" stroke="#e5e3dc" stroke-width="1" />
      <text x="42" y="13" text-anchor="middle" class="mono" font-size="8.5" fill="#18181b">TypeScript</text>

      <rect x="92" y="0" width="58" height="20" rx="2" fill="#ffffff" stroke="#e5e3dc" stroke-width="1" />
      <text x="121" y="13" text-anchor="middle" class="mono" font-size="8.5" fill="#18181b">React</text>

      <rect x="158" y="0" width="112" height="20" rx="2" fill="#ffffff" stroke="#1d4ed8" stroke-width="1" />
      <text x="214" y="13" text-anchor="middle" class="mono" font-size="8.5" fill="#1d4ed8">Three.js (WebGL)</text>

      <rect x="278" y="0" width="80" height="20" rx="2" fill="#ffffff" stroke="#e5e3dc" stroke-width="1" />
      <text x="318" y="13" text-anchor="middle" class="mono" font-size="8.5" fill="#18181b">Socket.IO</text>
    </g>

    <text y="108" class="mono" font-size="9" fill="#18181b">
      LIVE WEBGL APPLICATION &#8226; RESPONSIVE 60FPS
    </text>
  </g>
</svg>