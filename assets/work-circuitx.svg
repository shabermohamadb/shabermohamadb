<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 160" width="100%" height="100%">
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace; }

      @keyframes signalTravel {
        0% { stroke-dashoffset: 80; }
        100% { stroke-dashoffset: 0; }
      }
      .trace-pulse {
        stroke-dasharray: 6 6;
        animation: signalTravel 2s linear infinite;
      }
    </style>
  </defs>

  <rect width="940" height="160" fill="#0e0f11" rx="4" stroke="#27272a" stroke-width="1" />

  <!-- Left: Schematic Circuit Trace Vector Graphic -->
  <g transform="translate(24, 20)">
    <rect width="130" height="120" rx="2" fill="#141518" stroke="#27272a" stroke-width="1" />
    
    <!-- IC Chip Package -->
    <rect x="40" y="35" width="50" height="50" rx="2" fill="#1a1b1f" stroke="#3f3f46" stroke-width="1" />
    <text x="65" y="62" text-anchor="middle" class="mono" font-size="7.5" font-weight="700" fill="#2563eb">MCU</text>
    
    <!-- Pins & Traces -->
    <line x1="20" y1="45" x2="40" y2="45" stroke="#71717a" stroke-width="1.2" />
    <line x1="20" y1="60" x2="40" y2="60" stroke="#71717a" stroke-width="1.2" />
    <line x1="20" y1="75" x2="40" y2="75" stroke="#71717a" stroke-width="1.2" />

    <line class="trace-pulse" x1="90" y1="45" x2="115" y2="45" stroke="#2563eb" stroke-width="1.5" />
    <line class="trace-pulse" x1="90" y1="60" x2="120" y2="60" stroke="#2563eb" stroke-width="1.5" />
    <line class="trace-pulse" x1="90" y1="75" x2="115" y2="75" stroke="#2563eb" stroke-width="1.5" />

    <text x="65" y="112" text-anchor="middle" class="mono" font-size="7" fill="#71717a">NETLIST // ROUTER</text>
  </g>

  <!-- Right: Project Editorial Content -->
  <g transform="translate(180, 26)">
    <text class="mono" font-size="10" font-weight="700" fill="#a1a1aa" letter-spacing="1">PROJECT 04 // SYSTEM SOFTWARE &amp; EDA</text>
    <text y="22" class="sans" font-size="18" font-weight="800" fill="#f4f4f5">CircuitX &#8212; AI-Based PCB Design Software</text>
    <text y="42" class="sans" font-size="11.5" fill="#a1a1aa">
      Desktop electronic design automation (EDA) software providing schematic capture, netlist verification, and intelligent automatic PCB trace routing. Developed using Python, PySide6 (Qt6 GUI), and NumPy graph heuristics.
    </text>

    <!-- Technical Badges -->
    <g transform="translate(0, 68)">
      <rect x="0" y="0" width="70" height="20" rx="2" fill="#141518" stroke="#27272a" stroke-width="1" />
      <text x="35" y="13" text-anchor="middle" class="mono" font-size="8.5" fill="#f4f4f5">Python</text>

      <rect x="78" y="0" width="105" height="20" rx="2" fill="#141518" stroke="#27272a" stroke-width="1" />
      <text x="130" y="13" text-anchor="middle" class="mono" font-size="8.5" fill="#2563eb">PySide6 (Qt6)</text>

      <rect x="191" y="0" width="65" height="20" rx="2" fill="#141518" stroke="#27272a" stroke-width="1" />
      <text x="223" y="13" text-anchor="middle" class="mono" font-size="8.5" fill="#f4f4f5">NumPy</text>

      <rect x="264" y="0" width="60" height="20" rx="2" fill="#141518" stroke="#27272a" stroke-width="1" />
      <text x="294" y="13" text-anchor="middle" class="mono" font-size="8.5" fill="#f4f4f5">Pytest</text>

      <rect x="332" y="0" width="120" height="20" rx="2" fill="#141518" stroke="#27272a" stroke-width="1" />
      <text x="392" y="13" text-anchor="middle" class="mono" font-size="8.5" fill="#f4f4f5">Graph Algorithms</text>
    </g>

    <text y="108" class="mono" font-size="9" fill="#71717a">
      DESKTOP APPLICATION // SYSTEM LEVEL ENGINEERING
    </text>
  </g>
</svg>