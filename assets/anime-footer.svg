<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 110" width="100%" height="110">
  <defs>
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E1222" />
      <stop offset="100%" stop-color="#070912" />
    </linearGradient>
    <style>
      .f-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #FFFFFF; }
      .f-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; fill: #8B949E; }
      @keyframes lanternGlow {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 0.9; }
      }
      .lantern { animation: lanternGlow 3s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="840" height="110" rx="10" fill="url(#footerBg)" stroke="#1A2035" stroke-width="1" />

  <!-- Distant Skyline Silhouette in Footer -->
  <rect x="20" y="45" width="30" height="40" fill="#12162A" />
  <rect x="60" y="30" width="45" height="55" fill="#141930" />
  <rect x="115" y="50" width="35" height="35" fill="#111526" />
  <rect x="700" y="35" width="40" height="50" fill="#13172E" />
  <rect x="750" y="25" width="55" height="60" fill="#151A34" />

  <!-- Glowing Lanterns / Lights -->
  <circle class="lantern" cx="80" cy="42" r="2" fill="#E0AF68" />
  <circle class="lantern" cx="770" cy="38" r="2.5" fill="#7DCFFF" />

  <!-- Center Text -->
  <g transform="translate(420, 48)">
    <text x="0" y="0" text-anchor="middle" class="f-text">Let&#8217;s Build Something Extraordinary.</text>
    <text x="0" y="24" text-anchor="middle" class="f-sub">Open for full-stack engineering roles, AI collaborations &amp; creative projects.</text>
  </g>
</svg>