<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 300" width="100%" height="100%">
  <defs>
    <linearGradient id="pFeatBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050813" />
      <stop offset="50%" stop-color="#080e22" />
      <stop offset="100%" stop-color="#04060c" />
    </linearGradient>

    <linearGradient id="hubGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0070f3" />
    </linearGradient>

    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; }

      /* Animated bidirectional packet transfer */
      @keyframes sendPkt1 {
        0% { cx: 700px; cy: 150px; opacity: 1; }
        50% { cx: 580px; cy: 90px; opacity: 1; }
        100% { cx: 700px; cy: 150px; opacity: 1; }
      }
      @keyframes sendPkt2 {
        0% { cx: 700px; cy: 150px; opacity: 1; }
        50% { cx: 580px; cy: 210px; opacity: 1; }
        100% { cx: 700px; cy: 150px; opacity: 1; }
      }
      @keyframes sendPkt3 {
        0% { cx: 700px; cy: 150px; opacity: 1; }
        50% { cx: 830px; cy: 150px; opacity: 1; }
        100% { cx: 700px; cy: 150px; opacity: 1; }
      }
      .pkt1 { animation: sendPkt1 2.4s ease-in-out infinite; }
      .pkt2 { animation: sendPkt2 2.8s ease-in-out infinite; }
      .pkt3 { animation: sendPkt3 2.0s ease-in-out infinite; }

      /* Pulsing Central Hub Ring */
      @keyframes hubPulseRing {
        0% { r: 24px; opacity: 0.9; }
        100% { r: 48px; opacity: 0; }
      }
      .hub-ring { animation: hubPulseRing 2.2s cubic-bezier(0.2, 0.8, 0.2, 1) infinite; }

      /* Rotating Hub Orbit */
      @keyframes hubSpin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .hub-spin {
        transform-origin: 700px 150px;
        animation: hubSpin 10s linear infinite;
      }
    </style>
  </defs>

  <!-- Container -->
  <rect width="940" height="300" rx="8" fill="url(#pFeatBg)" stroke="#1e293b" stroke-width="1.2" />
  <rect width="940" height="3" fill="#00f0ff" opacity="0.85" />

  <!-- Left Accent Bar -->
  <rect x="0" y="0" width="4" height="300" fill="#00f0ff" />

  <!-- LEFT ZONE: Editorial Project Brief -->
  <g transform="translate(42, 38)">
    <!-- Flagship Badge -->
    <rect width="210" height="22" rx="3" fill="#0a182e" stroke="#00f0ff" stroke-width="0.8" />
    <text x="105" y="15" text-anchor="middle" class="mono" font-size="9" font-weight="700" fill="#00f0ff" letter-spacing="1.5">★ FLAGSHIP // CONCURRENCY</text>

    <!-- Project Title -->
    <text y="52" class="sans" font-size="28" font-weight="900" fill="#ffffff" letter-spacing="0.5">CollabSpace</text>
    <text y="74" class="sans" font-size="13.5" font-weight="600" fill="#38bdf8">Real-Time Collaborative Workspace &amp; AI Node Engine</text>

    <!-- Technical Narrative -->
    <text y="104" class="sans" font-size="12" fill="#cbd5e1">
      Engineered high-concurrency multi-user room state synchronization with sub-millisecond
    </text>
    <text y="122" class="sans" font-size="12" fill="#cbd5e1">
      duplex Socket.IO conduits, active typing telemetry &amp; contextual @AI participant threads.
    </text>

    <!-- Technology Stack Badges -->
    <g transform="translate(0, 146)">
      <rect x="0" y="0" width="94" height="24" rx="4" fill="#0c172e" stroke="#1e293b" stroke-width="1" />
      <text x="47" y="16" text-anchor="middle" class="mono" font-size="10" font-weight="600" fill="#38bdf8">TypeScript</text>

      <rect x="102" y="0" width="82" height="24" rx="4" fill="#0c172e" stroke="#1e293b" stroke-width="1" />
      <text x="143" y="16" text-anchor="middle" class="mono" font-size="10" font-weight="600" fill="#00f0ff">Node.js</text>

      <rect x="192" y="0" width="92" height="24" rx="4" fill="#0c172e" stroke="#1e293b" stroke-width="1" />
      <text x="238" y="16" text-anchor="middle" class="mono" font-size="10" font-weight="600" fill="#38bdf8">Socket.IO</text>

      <rect x="292" y="0" width="84" height="24" rx="4" fill="#0c172e" stroke="#1e293b" stroke-width="1" />
      <text x="334" y="16" text-anchor="middle" class="mono" font-size="10" font-weight="600" fill="#00f0ff">Express</text>

      <rect x="384" y="0" width="76" height="24" rx="4" fill="#0c172e" stroke="#1e293b" stroke-width="1" />
      <text x="422" y="16" text-anchor="middle" class="mono" font-size="10" font-weight="600" fill="#38bdf8">Tailwind</text>
    </g>

    <!-- Telemetry Metric Readout -->
    <g transform="translate(0, 196)">
      <text class="mono" font-size="10" fill="#64748b" letter-spacing="1">RTT: <tspan fill="#10b981" font-weight="700">12ms</tspan></text>
      <text x="90" class="mono" font-size="10" fill="#64748b" letter-spacing="1">PACKET LOSS: <tspan fill="#10b981" font-weight="700">0.00%</tspan></text>
      <text x="240" class="mono" font-size="10" fill="#64748b" letter-spacing="1">SYNC: <tspan fill="#00f0ff" font-weight="700">BI-DIRECTIONAL</tspan></text>
    </g>
  </g>

  <!-- RIGHT ZONE: Live Network Architecture Visualization -->
  <!-- Conduits connecting nodes -->
  <line x1="700" y1="150" x2="580" y2="90"  stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6" />
  <line x1="700" y1="150" x2="580" y2="210" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6" />
  <line x1="700" y1="150" x2="830" y2="150" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6" />

  <!-- Animated Data Packets Flowing -->
  <circle class="pkt1" cx="700" cy="150" r="3.5" fill="#00f0ff" />
  <circle class="pkt2" cx="700" cy="150" r="3.5" fill="#38bdf8" />
  <circle class="pkt3" cx="700" cy="150" r="4.0" fill="#ffffff" />

  <!-- Central Broker Node (Socket.IO Cluster) -->
  <circle class="hub-ring" cx="700" cy="150" fill="none" stroke="#00f0ff" stroke-width="1.5" />
  <g class="hub-spin">
    <circle cx="700" cy="150" r="32" fill="none" stroke="#00f0ff" stroke-width="0.8" stroke-dasharray="8 6" opacity="0.6" />
    <circle cx="700" cy="118" r="3" fill="#00f0ff" />
    <circle cx="700" cy="182" r="3" fill="#38bdf8" />
  </g>
  <circle cx="700" cy="150" r="24" fill="url(#hubGrad)" />
  <text x="700" y="148" text-anchor="middle" class="mono" font-size="8.5" font-weight="800" fill="#030712">SOCKET</text>
  <text x="700" y="158" text-anchor="middle" class="mono" font-size="7.5" font-weight="800" fill="#030712">BROKER</text>

  <!-- Peripheral Node A: Client Alpha -->
  <g transform="translate(580, 90)">
    <circle cx="0" cy="0" r="18" fill="#0a1428" stroke="#00f0ff" stroke-width="1.2" />
    <text text-anchor="middle" y="3" class="mono" font-size="8" font-weight="700" fill="#ffffff">USER_A</text>
    <text text-anchor="middle" y="26" class="mono" font-size="7.5" fill="#94a3b8">Client [TS]</text>
  </g>

  <!-- Peripheral Node B: Client Beta -->
  <g transform="translate(580, 210)">
    <circle cx="0" cy="0" r="18" fill="#0a1428" stroke="#38bdf8" stroke-width="1.2" />
    <text text-anchor="middle" y="3" class="mono" font-size="8" font-weight="700" fill="#ffffff">USER_B</text>
    <text text-anchor="middle" y="26" class="mono" font-size="7.5" fill="#94a3b8">Client [TS]</text>
  </g>

  <!-- Peripheral Node C: AI Assistant Daemon -->
  <g transform="translate(830, 150)">
    <circle cx="0" cy="0" r="22" fill="#0f1f3d" stroke="#00f0ff" stroke-width="1.5" />
    <text text-anchor="middle" y="1" class="mono" font-size="9" font-weight="800" fill="#00f0ff">@AI</text>
    <text text-anchor="middle" y="11" class="mono" font-size="7" font-weight="700" fill="#ffffff">THREAD</text>
    <text text-anchor="middle" y="30" class="mono" font-size="7.5" fill="#38bdf8">Agent Daemon</text>
  </g>
</svg>