<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 140" width="100%" height="100%">
  <defs>
    <linearGradient id="anaBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#040711" />
      <stop offset="50%" stop-color="#070c18" />
      <stop offset="100%" stop-color="#04060c" />
    </linearGradient>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; }
      @keyframes ecgMove {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }
      .ecg-line { stroke-dasharray: 400; animation: ecgMove 3s linear infinite; }
      @keyframes pulseDial {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; }
      }
      .dial-pulse { animation: pulseDial 2s ease-in-out infinite; }
      @keyframes spinSmall {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .spin-s { transform-origin: 875px 70px; animation: spinSmall 8s linear infinite; }
    </style>
  </defs>

  <rect width="940" height="140" rx="6" fill="url(#anaBg)" stroke="#1e293b" stroke-width="1" />
  <rect width="940" height="2" fill="#00f0ff" opacity="0.8" />

  <!-- Section Title & Telemetry -->
  <g transform="translate(36, 32)">
    <text class="mono" font-size="9.5" font-weight="700" fill="#00f0ff" letter-spacing="2">SECTION 05 // TELEMETRY &amp; ANALYTICS</text>
    <text class="sans" y="22" font-size="16" font-weight="800" fill="#ffffff">SYSTEM TELEMETRY &amp; GITHUB VELOCITY</text>
  </g>

  <!-- ECG Pulse Waveform (Left Center) -->
  <g transform="translate(36, 75)">
    <!-- Background grid -->
    <line x1="0" y1="20" x2="280" y2="20" stroke="#1e293b" stroke-width="0.8" />
    <line x1="0" y1="0"  x2="280" y2="0"  stroke="#1e293b" stroke-width="0.5" stroke-dasharray="2 4" />
    <line x1="0" y1="40" x2="280" y2="40" stroke="#1e293b" stroke-width="0.5" stroke-dasharray="2 4" />
    
    <!-- Heartbeat Wave -->
    <path class="ecg-line" d="M 0 20 L 40 20 L 50 8 L 60 32 L 70 4 L 80 20 L 140 20 L 150 10 L 160 30 L 170 20 L 220 20 L 230 6 L 240 34 L 250 20 L 280 20" fill="none" stroke="#00f0ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    <text x="0" y="52" class="mono" font-size="8.5" fill="#64748b" letter-spacing="1">GIT COMMIT PULSE // STEADY OSCILLATION</text>
  </g>

  <!-- 3 Center Telemetry Data Counters -->
  <g transform="translate(350, 42)">
    <!-- Counter 1: Repositories -->
    <rect width="130" height="66" rx="4" fill="#080e1c" stroke="#1e293b" stroke-width="1" />
    <rect width="130" height="2" rx="1" fill="#00f0ff" />
    <text x="65" y="20" text-anchor="middle" class="mono" font-size="8" fill="#64748b" letter-spacing="1">PUBLIC REPOS</text>
    <text x="65" y="44" text-anchor="middle" class="mono" font-size="20" font-weight="900" fill="#00f0ff">36</text>
    <text x="65" y="58" text-anchor="middle" class="mono" font-size="7.5" fill="#10b981">● 100% VERIFIED</text>

    <!-- Counter 2: Core Stacks -->
    <g transform="translate(142, 0)">
      <rect width="130" height="66" rx="4" fill="#080e1c" stroke="#1e293b" stroke-width="1" />
      <rect width="130" height="2" rx="1" fill="#38bdf8" />
      <text x="65" y="20" text-anchor="middle" class="mono" font-size="8" fill="#64748b" letter-spacing="1">PRIMARY CODE</text>
      <text x="65" y="42" text-anchor="middle" class="sans" font-size="14" font-weight="800" fill="#ffffff">TS / JS / PY</text>
      <text x="65" y="58" text-anchor="middle" class="mono" font-size="7.5" fill="#38bdf8">FULL-STACK CORE</text>
    </g>

    <!-- Counter 3: Architecture -->
    <g transform="translate(284, 0)">
      <rect width="130" height="66" rx="4" fill="#080e1c" stroke="#1e293b" stroke-width="1" />
      <rect width="130" height="2" rx="1" fill="#00f0ff" />
      <text x="65" y="20" text-anchor="middle" class="mono" font-size="8" fill="#64748b" letter-spacing="1">SPECIALTY</text>
      <text x="65" y="42" text-anchor="middle" class="sans" font-size="13" font-weight="800" fill="#00f0ff">AI &amp; REALTIME</text>
      <text x="65" y="58" text-anchor="middle" class="mono" font-size="7.5" fill="#10b981">SOCKETS &amp; WEBGL</text>
    </g>
  </g>

  <!-- Right Side Cyber Dial Indicator -->
  <g transform="translate(875, 70)">
    <circle cx="0" cy="0" r="32" fill="#060c18" stroke="#1e293b" stroke-width="1" />
    <circle class="spin-s" cx="0" cy="0" r="26" fill="none" stroke="#00f0ff" stroke-width="1" stroke-dasharray="12 8" opacity="0.8" />
    <circle class="dial-pulse" cx="0" cy="0" r="16" fill="#0c1830" stroke="#38bdf8" stroke-width="1.2" />
    <text text-anchor="middle" y="3" class="mono" font-size="7.5" font-weight="800" fill="#00f0ff">SYNC</text>
    <text text-anchor="middle" y="46" class="mono" font-size="7.5" fill="#64748b" letter-spacing="1">TELEMETRY</text>
  </g>
</svg>