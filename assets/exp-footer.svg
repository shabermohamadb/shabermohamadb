<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 180" width="100%" height="100%">
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace; }

      @keyframes sigGlint {
        0% { stroke-dashoffset: 700; }
        100% { stroke-dashoffset: 0; }
      }
      .sig-draw {
        stroke-dasharray: 700;
        animation: sigGlint 5s ease-in-out infinite alternate;
      }
    </style>
  </defs>

  <rect width="940" height="180" fill="#060709" />
  <line x1="20" y1="20" x2="920" y2="20" stroke="#181a22" stroke-width="1" />

  <!-- Massive Headline: BUILT WITH CURIOSITY. -->
  <g transform="translate(44, 85)">
    <text y="0" class="sans" font-size="44" font-weight="900" fill="#f3f3f6" letter-spacing="-1">
      BUILT WITH CURIOSITY<tspan fill="#2563eb">.</tspan>
    </text>
    <text y="32" class="mono" font-size="12" font-weight="600" fill="#71717a" letter-spacing="1.5">
      SHABER MOHAMAD B. &#8226; TAMIL NADU, INDIA &#8226; STELLA MARY&apos;S COLLEGE OF ENGINEERING
    </text>
  </g>

  <!-- Kinetic Signature Vector Flourish -->
  <path class="sig-draw" d="M 660 85 Q 730 40 790 80 T 890 75" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" />
</svg>