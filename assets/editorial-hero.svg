<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 360" width="100%" height="100%">
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace; }

      /* Subtle line drawing animation on geometric accent */
      @keyframes drawWire {
        0% { stroke-dashoffset: 400; }
        50% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 0; }
      }
      .wire-draw {
        stroke-dasharray: 400;
        animation: drawWire 6s ease-in-out infinite alternate;
      }

      /* Slow mechanical rotating coordinate compass */
      @keyframes slowRotate {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .rotate-mech {
        transform-origin: 820px 170px;
        animation: slowRotate 24s linear infinite;
      }

      /* Infinite Marquee Ticker */
      @keyframes tickerSlide {
        0% { transform: translateX(0); }
        100% { transform: translateX(-50%); }
      }
      .ticker-tape {
        display: inline-block;
        animation: tickerSlide 22s linear infinite;
      }

      /* Subtle blink for status dot */
      @keyframes statusBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }
      .dot-blink { animation: statusBlink 2.5s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Solid Matte Dark Background -->
  <rect width="940" height="360" fill="#0c0d0e" />

  <!-- Outer Hairline Structural Grid -->
  <rect x="20" y="20" width="900" height="320" fill="none" stroke="#27272a" stroke-width="1" />

  <!-- Top Metadata Bar -->
  <g transform="translate(40, 48)">
    <circle class="dot-blink" cx="4" cy="4" r="3.5" fill="#2563eb" />
    <text x="18" y="7" class="mono" font-size="11" font-weight="600" fill="#f4f4f5" letter-spacing="1">SHABER MOHAMAD B</text>
    <text x="210" y="7" class="mono" font-size="11" fill="#71717a">&#8212;</text>
    <text x="235" y="7" class="mono" font-size="11" fill="#a1a1aa">FULL-STACK DEVELOPER</text>
    <text x="440" y="7" class="mono" font-size="11" fill="#71717a">&#8212;</text>
    <text x="465" y="7" class="mono" font-size="11" fill="#71717a">B.TECH AI &amp; DATA SCIENCE</text>
    <text x="740" y="7" class="mono" font-size="11" fill="#a1a1aa" text-anchor="end">TAMIL NADU, IN</text>
  </g>

  <!-- Horizontal Divider Rule -->
  <line x1="20" y1="68" x2="920" y2="68" stroke="#27272a" stroke-width="1" />

  <!-- MAIN EDITORIAL HEADLINE (Oversized, confident brutalist composition) -->
  <g transform="translate(44, 130)">
    <text y="0" class="sans" font-size="52" font-weight="900" fill="#f4f4f5" letter-spacing="-1.5">
      I BUILD THINGS
    </text>
    <text y="58" class="sans" font-size="52" font-weight="900" fill="#f4f4f5" letter-spacing="-1.5">
      FOR THE WEB<tspan fill="#2563eb">.</tspan>
    </text>
    
    <!-- Editorial Subtitle -->
    <text y="100" class="sans" font-size="15" font-weight="400" fill="#a1a1aa" letter-spacing="0">
      Focused on distributed real-time systems, 3D spatial web graphics, and clean full-stack architecture.
    </text>
  </g>

  <!-- RIGHT MECHANICAL SCHEMATIC (Clean geometric line drawing, no cheesy glow) -->
  <g class="rotate-mech">
    <!-- Concentric Technical Measurement Rings -->
    <circle cx="820" cy="170" r="54" fill="none" stroke="#27272a" stroke-width="1" />
    <circle cx="820" cy="170" r="44" fill="none" stroke="#3f3f46" stroke-width="1" stroke-dasharray="2 4" />
    <circle cx="820" cy="170" r="28" fill="none" stroke="#27272a" stroke-width="1" />
    <circle cx="820" cy="170" r="3" fill="#2563eb" />
    <!-- Crosshairs -->
    <line x1="755" y1="170" x2="885" y2="170" stroke="#27272a" stroke-width="1" />
    <line x1="820" y1="105" x2="820" y2="235" stroke="#27272a" stroke-width="1" />
  </g>

  <!-- Kinetic Vector Wireframe Accent (Isometric Box Wireframe) -->
  <g transform="translate(820, 170)">
    <polygon class="wire-draw" points="0,-24 22,-12 22,14 0,26 -22,14 -22,-12" fill="none" stroke="#2563eb" stroke-width="1.2" />
    <line class="wire-draw" x1="0" y1="2" x2="0" y2="26" stroke="#52525b" stroke-width="1" />
    <line class="wire-draw" x1="0" y1="2" x2="22" y2="-12" stroke="#52525b" stroke-width="1" />
    <line class="wire-draw" x1="0" y1="2" x2="-22" y2="-12" stroke="#52525b" stroke-width="1" />
  </g>

  <!-- Bottom Divider Rule -->
  <line x1="20" y1="294" x2="920" y2="294" stroke="#27272a" stroke-width="1" />

  <!-- Bottom Continuous Typography Marquee Ticker -->
  <g transform="translate(0, 318)">
    <g class="ticker-tape">
      <text class="mono" font-size="10.5" font-weight="600" fill="#71717a" letter-spacing="1.5">
        FULL-STACK ARCHITECTURE &#8226; REAL-TIME WEBSOCKETS &#8226; THREE.JS WEBGL &#8226; PYTHON &amp; EDA TOOLING &#8226; TYPESCRIPT &#8226; NEXT.JS &#8226; STELLA MARY'S COLLEGE OF ENGINEERING &#8226; TAMIL NADU, INDIA &#8226; OPEN TO COLLABORATION &#8226; FULL-STACK ARCHITECTURE &#8226; REAL-TIME WEBSOCKETS &#8226; THREE.JS WEBGL &#8226; PYTHON &amp; EDA TOOLING &#8226; TYPESCRIPT &#8226; NEXT.JS &#8226; STELLA MARY'S COLLEGE OF ENGINEERING &#8226; TAMIL NADU, INDIA &#8226; OPEN TO COLLABORATION &#8226;&#160;
      </text>
    </g>
  </g>
</svg>