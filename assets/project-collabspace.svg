<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <linearGradient id="p1Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0D14" />
      <stop offset="100%" stop-color="#06070B" />
    </linearGradient>
    <style>
      .mono { font-family: ui-monospace, 'JetBrains Mono', monospace; }
      .sans { font-family: system-ui, -apple-system, 'SF Pro Display', Inter, sans-serif; }
      @keyframes pulseNode { 0%, 100% { opacity: 0.8; } 50% { opacity: 0.3; } }
      .pulse { animation: pulseNode 2s infinite ease-in-out; }
    </style>
  </defs>

  <rect width="900" height="240" rx="10" fill="url(#p1Bg)" stroke="#1A202E" stroke-width="1" />
  
  <!-- Left Side: Project Identity -->
  <g transform="translate(32, 28)">
    <text x="0" y="16" class="mono" font-size="10" font-weight="600" fill="#38BDF8" letter-spacing="2">PROJECT 01 // REAL-TIME AI ARCHITECTURE</text>
    <text x="0" y="44" class="sans" font-size="22" font-weight="800" fill="#FFFFFF">CollabSpace — Collaborative Chat &amp; AI Platform</text>
    <text x="0" y="70" class="sans" font-size="13" fill="#94A3B8">Production multi-user communication system with sub-millisecond Socket.IO sync,</text>
    <text x="0" y="88" class="sans" font-size="13" fill="#94A3B8">workspace room channels, and conversational @AI assistant orchestration.</text>
    
    <!-- Meta Chips -->
    <g transform="translate(0, 114)">
      <rect width="102" height="24" rx="4" fill="#131722" stroke="#242C3F" stroke-width="1" />
      <text x="51" y="16" text-anchor="middle" class="mono" font-size="10.5" fill="#38BDF8">TypeScript</text>

      <rect x="110" width="86" height="24" rx="4" fill="#131722" stroke="#242C3F" stroke-width="1" />
      <text x="153" y="16" text-anchor="middle" class="mono" font-size="10.5" fill="#818CF8">Socket.IO</text>

      <rect x="204" width="84" height="24" rx="4" fill="#131722" stroke="#242C3F" stroke-width="1" />
      <text x="246" y="16" text-anchor="middle" class="mono" font-size="10.5" fill="#E2E8F0">Node.js</text>

      <rect x="296" width="94" height="24" rx="4" fill="#131722" stroke="#242C3F" stroke-width="1" />
      <text x="343" y="16" text-anchor="middle" class="mono" font-size="10.5" fill="#E2E8F0">Tailwind CSS</text>
    </g>

    <!-- Links -->
    <g transform="translate(0, 154)">
      <text x="0" y="14" class="mono" font-size="11" font-weight="600" fill="#10B981">LIVE DEPLOYMENT: collab-chat-five.vercel.app ↗</text>
    </g>
  </g>

  <!-- Right Side: Real-Time Topology Visualization -->
  <g transform="translate(540, 26)">
    <rect width="324" height="186" rx="8" fill="#0D1017" stroke="#1E2536" stroke-width="1" />
    <text x="18" y="24" class="mono" font-size="9.5" fill="#64748B" letter-spacing="1">SOCKET PACKET TOPOLOGY</text>

    <!-- Room Channels -->
    <rect x="18" y="38" width="136" height="34" rx="4" fill="#141924" stroke="#232C3E" stroke-width="1" />
    <circle cx="32" cy="55" r="3.5" fill="#10B981" />
    <text x="44" y="58" class="mono" font-size="10" fill="#E2E8F0">#engineering-hub</text>

    <rect x="18" y="78" width="136" height="34" rx="4" fill="#141924" stroke="#232C3E" stroke-width="1" />
    <circle cx="32" cy="95" r="3.5" fill="#38BDF8" />
    <text x="44" y="98" class="mono" font-size="10" fill="#E2E8F0">#general-stream</text>

    <!-- AI Agent Node -->
    <rect x="174" y="38" width="132" height="74" rx="6" fill="#171A2E" stroke="#4F46E5" stroke-width="1.2" />
    <circle class="pulse" cx="192" cy="58" r="4" fill="#818CF8" />
    <text x="204" y="62" class="mono" font-size="11" font-weight="700" fill="#FFFFFF">@AI Node</text>
    <text x="190" y="82" class="mono" font-size="9" fill="#94A3B8">Context History</text>
    <text x="190" y="96" class="mono" font-size="9" fill="#38BDF8">Latency: &lt; 15ms</text>

    <!-- Connection Lines -->
    <path d="M 154 55 L 174 55" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="2 2" />
    <path d="M 154 95 L 174 85" stroke="#818CF8" stroke-width="1.5" stroke-dasharray="2 2" />

    <!-- Terminal Status Banner -->
    <rect x="18" y="128" width="288" height="42" rx="4" fill="#0A0D14" stroke="#1B2232" stroke-width="1" />
    <text x="30" y="145" class="mono" font-size="9" fill="#10B981">&gt; Socket.IO Gateway: Connected (State: Sync)</text>
    <text x="30" y="159" class="mono" font-size="9" fill="#64748B">&gt; Event Dispatched: USER_MESSAGE_BROADCAST</text>
  </g>
</svg>