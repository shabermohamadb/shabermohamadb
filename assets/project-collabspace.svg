<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 90" width="100%" height="90">
  <defs>
    <linearGradient id="p1Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0E1326" />
      <stop offset="100%" stop-color="#090B14" />
    </linearGradient>
    <style>
      .p-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 16px; font-weight: 800; fill: #FFFFFF; }
      .p-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; fill: #94A3B8; }
      .p-tag { font-family: ui-monospace, monospace; font-size: 10px; font-weight: 600; fill: #7DCFFF; letter-spacing: 1px; }
      @keyframes pulseRing {
        0% { r: 8px; opacity: 0.9; }
        100% { r: 24px; opacity: 0; }
      }
      .ring { animation: pulseRing 2s cubic-bezier(0.2, 0.8, 0.2, 1) infinite; }
    </style>
  </defs>

  <rect width="840" height="90" rx="8" fill="url(#p1Grad)" stroke="#1E253E" stroke-width="1" />

  <!-- Animated Socket & AI Node Visual (Left) -->
  <g transform="translate(48, 45)">
    <circle cx="0" cy="0" r="20" fill="#131932" stroke="#2D3860" stroke-width="1" />
    <circle class="ring" cx="0" cy="0" fill="none" stroke="#7DCFFF" stroke-width="1.5" />
    <circle cx="0" cy="0" r="6" fill="#7DCFFF" />
    <circle cx="0" cy="0" r="2.5" fill="#FFFFFF" />
  </g>

  <!-- Project Identity & Description -->
  <g transform="translate(86, 32)">
    <text x="0" y="0" class="p-tag">FEATURED 01 // REAL-TIME WEB</text>
    <text x="0" y="20" class="p-title">CollabSpace &#8212; Collaborative Workspace &amp; AI Node</text>
    <text x="0" y="38" class="p-desc">Sub-millisecond multi-user room messaging with contextual @AI assistant thread participation.</text>
  </g>

  <!-- Right Badges -->
  <g transform="translate(680, 48)">
    <rect width="130" height="26" rx="4" fill="#131930" stroke="#2B365A" stroke-width="1" />
    <text x="65" y="17" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10.5" font-weight="600" fill="#7DCFFF">Socket.IO &#8226; TS</text>
  </g>
</svg>