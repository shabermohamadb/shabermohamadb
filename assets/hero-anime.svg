<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%">
  <defs>
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#060812" />
      <stop offset="40%" stop-color="#0D1226" />
      <stop offset="75%" stop-color="#151934" />
      <stop offset="100%" stop-color="#080A14" />
    </linearGradient>

    <linearGradient id="building1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1B203B" />
      <stop offset="100%" stop-color="#0B0E1E" />
    </linearGradient>

    <linearGradient id="building2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#23294C" />
      <stop offset="100%" stop-color="#0E1124" />
    </linearGradient>

    <linearGradient id="screenCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7DCFFF" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="screenPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BB9AF7" />
      <stop offset="100%" stop-color="#7AA2F7" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#7DCFFF" />
    </linearGradient>

    <style>
      .title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 44px;
        font-weight: 900;
        fill: url(#titleGrad);
        letter-spacing: 2px;
      }
      .subtitle {
        font-family: ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace;
        font-size: 13px;
        font-weight: 600;
        fill: #BB9AF7;
        letter-spacing: 2.5px;
      }
      .quote {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 13.5px;
        font-style: italic;
        fill: #9AA5CE;
        letter-spacing: 0.5px;
      }

      /* 1. Character Breathing Animation */
      @keyframes charBreathe {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-3.5px); }
      }
      /* 2. Anime Hair Sway */
      @keyframes hairSway {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(-2.5deg); }
      }

      /* 3. Rain Animations (Staggered layers) */
      @keyframes rainDrop1 {
        0% { transform: translateY(-100px) translateX(0); opacity: 0; }
        30% { opacity: 0.7; }
        100% { transform: translateY(460px) translateX(-45px); opacity: 0; }
      }
      @keyframes rainDrop2 {
        0% { transform: translateY(-120px) translateX(0); opacity: 0; }
        30% { opacity: 0.85; }
        100% { transform: translateY(470px) translateX(-50px); opacity: 0; }
      }
      @keyframes rainDrop3 {
        0% { transform: translateY(-80px) translateX(0); opacity: 0; }
        40% { opacity: 0.6; }
        100% { transform: translateY(480px) translateX(-40px); opacity: 0; }
      }

      /* 4. Ambient Screen and Room Lighting */
      @keyframes screenPulse {
        0%, 100% { opacity: 0.22; }
        50% { opacity: 0.35; }
      }
      @keyframes cursorBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes beaconBlink {
        0%, 100% { opacity: 0.2; }
        50% { opacity: 1; }
      }

      /* 5. Floating Embers / Motes */
      @keyframes moteDrift1 {
        0% { transform: translateY(0) translateX(0); opacity: 0.2; }
        50% { transform: translateY(-25px) translateX(15px); opacity: 0.9; }
        100% { transform: translateY(-50px) translateX(5px); opacity: 0; }
      }
      @keyframes moteDrift2 {
        0% { transform: translateY(0) translateX(0); opacity: 0.1; }
        50% { transform: translateY(-30px) translateX(-12px); opacity: 0.8; }
        100% { transform: translateY(-60px) translateX(-2px); opacity: 0; }
      }

      .character-body { animation: charBreathe 4s ease-in-out infinite; transform-origin: 260px 420px; }
      .hair-strand { animation: hairSway 3s ease-in-out infinite; transform-origin: 250px 245px; }
      .rain-1 { animation: rainDrop1 1.5s linear infinite; }
      .rain-2 { animation: rainDrop2 2.0s linear infinite 0.4s; }
      .rain-3 { animation: rainDrop3 1.8s linear infinite 0.8s; }
      .screen-glow { animation: screenPulse 3.5s ease-in-out infinite; }
      .cursor { animation: cursorBlink 0.9s infinite; }
      .beacon { animation: beaconBlink 2.2s ease-in-out infinite; }
      .mote-1 { animation: moteDrift1 4.5s ease-in-out infinite; }
      .mote-2 { animation: moteDrift2 5.5s ease-in-out infinite 1.2s; }
    </style>
  </defs>

  <!-- Frame Background -->
  <rect width="900" height="440" rx="14" fill="url(#nightSky)" />

  <!-- SKYLINE BACKDROP -->
  <g opacity="0.92">
    <ellipse cx="450" cy="280" rx="420" ry="80" fill="#7AA2F7" opacity="0.08" filter="blur(50px)" />
    <ellipse cx="650" cy="270" rx="200" ry="60" fill="#BB9AF7" opacity="0.1" filter="blur(40px)" />

    <!-- Buildings -->
    <rect x="40" y="170" width="45" height="150" fill="#0E1222" />
    <rect x="95" y="140" width="60" height="180" fill="#0C101F" />
    <rect x="165" y="190" width="50" height="130" fill="#101428" />
    <rect x="225" y="120" width="70" height="200" fill="url(#building1)" />
    <rect x="305" y="155" width="55" height="165" fill="#0F1326" />
    <rect x="370" y="180" width="80" height="140" fill="#0D1022" />
    <rect x="460" y="135" width="65" height="185" fill="url(#building2)" />
    <rect x="535" y="160" width="50" height="160" fill="#0E1224" />
    <rect x="595" y="105" width="85" height="215" fill="url(#building1)" />
    <rect x="690" y="150" width="60" height="170" fill="#101428" />
    <rect x="760" y="130" width="95" height="190" fill="url(#building2)" />

    <!-- Radio Tower Beacons -->
    <line x1="260" y1="80" x2="260" y2="120" stroke="#38436B" stroke-width="1.5" />
    <circle class="beacon" cx="260" cy="78" r="2.5" fill="#F7768E" />

    <line x1="638" y1="60" x2="638" y2="105" stroke="#38436B" stroke-width="1.5" />
    <circle class="beacon" cx="638" cy="58" r="3" fill="#F7768E" />

    <line x1="808" y1="90" x2="808" y2="130" stroke="#38436B" stroke-width="1.5" />
    <circle class="beacon" cx="808" cy="88" r="2" fill="#7DCFFF" />

    <!-- Window Lights -->
    <rect x="235" y="135" width="6" height="4" fill="#E0AF68" opacity="0.6" />
    <rect x="247" y="135" width="6" height="4" fill="#7DCFFF" opacity="0.5" />
    <rect x="260" y="150" width="6" height="4" fill="#E0AF68" opacity="0.7" />
    <rect x="472" y="150" width="6" height="4" fill="#BB9AF7" opacity="0.6" />
    <rect x="488" y="165" width="6" height="4" fill="#7DCFFF" opacity="0.7" />
    <rect x="610" y="120" width="6" height="4" fill="#E0AF68" opacity="0.7" />
    <rect x="625" y="135" width="6" height="4" fill="#7DCFFF" opacity="0.6" />
    <rect x="642" y="135" width="6" height="4" fill="#BB9AF7" opacity="0.5" />

    <!-- Window Pane Framework -->
    <line x1="300" y1="10" x2="300" y2="320" stroke="#141829" stroke-width="3" opacity="0.7" />
    <line x1="600" y1="10" x2="600" y2="320" stroke="#141829" stroke-width="3" opacity="0.7" />
    <line x1="20" y1="210" x2="880" y2="210" stroke="#141829" stroke-width="2" opacity="0.5" />

    <!-- Rain Streaks -->
    <g stroke="#7DCFFF" stroke-width="1.3" opacity="0.5" stroke-linecap="round">
      <line class="rain-1" x1="110" y1="20" x2="95" y2="60" />
      <line class="rain-2" x1="230" y1="10" x2="215" y2="55" />
      <line class="rain-3" x1="370" y1="30" x2="355" y2="70" />
      <line class="rain-1" x1="510" y1="15" x2="495" y2="58" />
      <line class="rain-2" x1="660" y1="25" x2="645" y2="65" />
      <line class="rain-3" x1="780" y1="10" x2="765" y2="52" />
      <line class="rain-1" x1="170" y1="85" x2="155" y2="125" />
      <line class="rain-2" x1="420" y1="95" x2="405" y2="135" />
      <line class="rain-3" x1="710" y1="75" x2="695" y2="115" />
    </g>
  </g>

  <!-- FOREGROUND DESK & BATTLESTATION -->
  <ellipse class="screen-glow" cx="450" cy="320" rx="360" ry="100" fill="#7DCFFF" filter="blur(60px)" />
  <ellipse class="screen-glow" cx="540" cy="300" rx="220" ry="80" fill="#BB9AF7" filter="blur(50px)" />

  <!-- Desk Surface -->
  <polygon points="40,410 860,410 900,440 0,440" fill="#0B0D18" stroke="#1E2338" stroke-width="1" />

  <!-- Left Vertical Monitor -->
  <rect x="290" y="255" width="70" height="125" rx="4" fill="#0C0F1D" stroke="#252C48" stroke-width="1.5" />
  <rect x="295" y="260" width="60" height="115" rx="2" fill="url(#screenPurple)" opacity="0.35" />
  <line x1="302" y1="272" x2="330" y2="272" stroke="#BB9AF7" stroke-width="1.5" />
  <line x1="302" y1="282" x2="345" y2="282" stroke="#7DCFFF" stroke-width="1.5" />
  <line x1="310" y1="292" x2="340" y2="292" stroke="#9AA5CE" stroke-width="1" />
  <line x1="302" y1="314" x2="348" y2="314" stroke="#BB9AF7" stroke-width="1.5" />

  <!-- Primary Ultrawide Monitor -->
  <rect x="375" y="240" width="220" height="140" rx="5" fill="#0C0F1D" stroke="#252C48" stroke-width="1.5" />
  <rect x="382" y="247" width="206" height="126" rx="3" fill="url(#screenCyan)" opacity="0.4" />
  <line x1="395" y1="262" x2="445" y2="262" stroke="#7DCFFF" stroke-width="2" />
  <line x1="395" y1="274" x2="475" y2="274" stroke="#E0AF68" stroke-width="1.5" />
  <line x1="410" y1="286" x2="520" y2="286" stroke="#BB9AF7" stroke-width="1.5" />
  <line x1="410" y1="298" x2="495" y2="298" stroke="#7AA2F7" stroke-width="1.5" />
  <line x1="425" y1="310" x2="550" y2="310" stroke="#9ECE6A" stroke-width="1.5" />
  <!-- Blinking Cursor -->
  <rect class="cursor" x="485" y="320" width="6" height="11" fill="#7DCFFF" />
  <line x1="395" y1="348" x2="560" y2="348" stroke="#7DCFFF" stroke-width="1" stroke-dasharray="3 3" />

  <!-- Monitor Stands -->
  <rect x="320" y="380" width="10" height="20" fill="#171C30" />
  <rect x="478" y="380" width="14" height="20" fill="#171C30" />

  <!-- ANIMATED DEVELOPER CHARACTER (Breathing & Hair Sway) -->
  <g class="character-body" fill="#090B15" stroke="#1B2138" stroke-width="1">
    <!-- Back / Shoulders Silhouette -->
    <path d="M 210 440 Q 230 350 270 340 Q 300 340 320 440 Z" />
    <!-- Neck -->
    <rect x="255" y="315" width="25" height="30" rx="3" />
    <!-- Head Profile -->
    <path d="M 245 280 Q 255 250 280 255 Q 300 260 295 295 Q 290 320 265 320 Q 245 315 245 280 Z" />
    
    <!-- Animated Hair Strands (Swaying subtly) -->
    <g class="hair-strand">
      <path d="M 240 275 Q 245 245 275 245 Q 290 245 300 255 Q 312 265 305 280 Q 295 265 280 265 Q 260 265 250 285 Z" />
      <path d="M 238 280 Q 242 260 252 270 Q 246 285 238 280 Z" fill="#090B15" />
    </g>

    <!-- Glowing Headphone Cup & Band -->
    <ellipse cx="270" cy="285" rx="7" ry="12" fill="#7DCFFF" stroke="#252C48" opacity="0.85" />
    <path d="M 258 280 Q 265 250 278 255" fill="none" stroke="#7DCFFF" stroke-width="2.5" />
  </g>

  <!-- Mechanical Keyboard with Underglow -->
  <rect x="390" y="400" width="130" height="16" rx="2" fill="#12172A" stroke="#2D3556" stroke-width="1" />
  <line x1="394" y1="414" x2="516" y2="414" stroke="#7DCFFF" stroke-width="1.5" opacity="0.8" />

  <!-- Steaming Lo-Fi Coffee Mug -->
  <rect x="545" y="395" width="16" height="20" rx="2" fill="#1A1F36" stroke="#2D3556" stroke-width="1" />
  <path d="M 561 400 Q 567 405 561 410" fill="none" stroke="#2D3556" stroke-width="1.5" />
  <path d="M 550 390 Q 553 382 549 375" fill="none" stroke="#9AA5CE" stroke-width="1" opacity="0.4" />

  <!-- Floating Particles / Embers -->
  <circle class="mote-1" cx="190" cy="200" r="1.5" fill="#7DCFFF" />
  <circle class="mote-2" cx="340" cy="150" r="1" fill="#E0AF68" />
  <circle class="mote-1" cx="510" cy="190" r="2" fill="#BB9AF7" />
  <circle class="mote-2" cx="680" cy="140" r="1.5" fill="#7DCFFF" />
  <circle class="mote-1" cx="740" cy="230" r="1" fill="#E0AF68" />

  <!-- Typography Overlay -->
  <g transform="translate(48, 85)">
    <text x="0" y="0" class="title">SHABER MOHAMAD B</text>
    <text x="0" y="28" class="subtitle">FULL-STACK DEVELOPER | AI &amp; DATA SCIENCE</text>
    <text x="0" y="56" class="quote">&#8220;Turning ideas into experiences through code.&#8221;</text>
  </g>

  <!-- Outer Border -->
  <rect x="1" y="1" width="898" height="438" rx="13" fill="none" stroke="#1D243B" stroke-width="1.5" />
</svg>