<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 140" width="100%" height="100%">
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace; }

      @keyframes drawLine {
        0% { stroke-dashoffset: 600; }
        100% { stroke-dashoffset: 0; }
      }
      .sig-line {
        stroke-dasharray: 600;
        animation: drawLine 4s ease-in-out infinite alternate;
      }
    </style>
  </defs>

  <rect width="940" height="140" fill="#0c0d0e" />
  <line x1="20" y1="20" x2="920" y2="20" stroke="#27272a" stroke-width="1" />

  <!-- Authentic Signature Quote -->
  <g transform="translate(44, 60)">
    <text class="sans" font-size="20" font-weight="700" fill="#f4f4f5">
      &#8220;Made with curiosity. Built with code.&#8221;
    </text>
    <text y="28" class="mono" font-size="11" fill="#71717a">
      SHABER MOHAMAD B &#8226; B.TECH AI &amp; DS &#8226; STELLA MARY'S COLLEGE OF ENGINEERING
    </text>
  </g>

  <!-- Kinetic Vector Signature Line (Handcrafted stroke feel) -->
  <path class="sig-line" d="M 720 70 Q 760 40 800 65 T 880 60" fill="none" stroke="#2563eb" stroke-width="1.8" stroke-linecap="round" />
</svg>