<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 160" width="100%" height="100%">
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace; }

      @keyframes pdfScan {
        0%, 100% { transform: translateY(0); opacity: 0.3; }
        50% { transform: translateY(32px); opacity: 1; }
      }
      .laser-scan { animation: pdfScan 2.4s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="940" height="160" fill="#0e0f11" rx="4" stroke="#22242a" stroke-width="1" />

  <!-- Left: Dynamic PDF Synthesis Wireframe -->
  <g transform="translate(24, 20)">
    <rect width="130" height="120" rx="2" fill="#141518" stroke="#22242a" stroke-width="1" />
    <rect width="130" height="18" fill="#1a1b1f" />
    <text x="12" y="12" class="mono" font-size="7.5" font-weight="700" fill="#a1a1aa">INV-2024-0891</text>
    <text x="118" y="12" class="mono" font-size="7" fill="#2563eb" text-anchor="end">PDF SYNTH</text>

    <!-- Document structure lines -->
    <line x1="12" y1="32" x2="60"  y2="32" stroke="#52525b" stroke-width="1" />
    <line x1="12" y1="44" x2="118" y2="44" stroke="#33363f" stroke-width="0.8" />
    <line x1="12" y1="56" x2="118" y2="56" stroke="#33363f" stroke-width="0.8" />
    <line x1="12" y1="68" x2="118" y2="68" stroke="#33363f" stroke-width="0.8" />

    <!-- Ledger Total -->
    <rect x="68" y="86" width="50" height="16" rx="2" fill="#181920" stroke="#2563eb" stroke-width="0.8" />
    <text x="93" y="97" text-anchor="middle" class="mono" font-size="7" font-weight="700" fill="#2563eb">SYNCED</text>

    <!-- Animated laser scan line across the document -->
    <line class="laser-scan" x1="6" y1="28" x2="124" y2="28" stroke="#3b82f6" stroke-width="1.2" />
  </g>

  <!-- Right: Project Editorial Content -->
  <g transform="translate(180, 26)">
    <text class="mono" font-size="10" font-weight="700" fill="#a1a1aa" letter-spacing="1">PROJECT 05 // ENTERPRISE AUTOMATION &amp; PDF PIPELINE</text>
    <text y="22" class="sans" font-size="18" font-weight="800" fill="#f5f5f7">Al-Ameen Automation Portal</text>
    <text y="42" class="sans" font-size="11.5" fill="#a1a1aa">
      Enterprise workflow and billing platform featuring automated dynamic PDF invoice generation, transactional inventory ledgers, and multi-tenant database synchronization using Supabase and SQLite.
    </text>

    <!-- Technical Badges -->
    <g transform="translate(0, 68)">
      <rect x="0" y="0" width="76" height="20" rx="2" fill="#141518" stroke="#22242a" stroke-width="1" />
      <text x="38" y="13" text-anchor="middle" class="mono" font-size="8.5" fill="#f5f5f7">Next.js</text>

      <rect x="84" y="0" width="88" height="20" rx="2" fill="#141518" stroke="#22242a" stroke-width="1" />
      <text x="128" y="13" text-anchor="middle" class="mono" font-size="8.5" fill="#f5f5f7">TypeScript</text>

      <rect x="180" y="0" width="80" height="20" rx="2" fill="#141518" stroke="#22242a" stroke-width="1" />
      <text x="220" y="13" text-anchor="middle" class="mono" font-size="8.5" fill="#2563eb">Supabase</text>

      <rect x="268" y="0" width="65" height="20" rx="2" fill="#141518" stroke="#22242a" stroke-width="1" />
      <text x="300" y="13" text-anchor="middle" class="mono" font-size="8.5" fill="#f5f5f7">SQLite</text>

      <rect x="341" y="0" width="60" height="20" rx="2" fill="#141518" stroke="#22242a" stroke-width="1" />
      <text x="371" y="13" text-anchor="middle" class="mono" font-size="8.5" fill="#f5f5f7">jsPDF</text>
    </g>

    <text y="108" class="mono" font-size="9" fill="#10b981">
      &#10003; LIVE AUTOMATION SYSTEM AVAILABLE
    </text>
  </g>
</svg>