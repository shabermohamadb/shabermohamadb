<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 160" width="100%" height="100%">
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace; }

      @keyframes orbitSpin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .spin-orbit { transform-origin: 89px 80px; animation: orbitSpin 14s linear infinite; }
    </style>
  </defs>

  <rect width="940" height="160" fill="#0e0f11" rx="4" stroke="#22242a" stroke-width="1" />

  <!-- Left: 3D Camera Frustum & Orbit Controls Graphic -->
  <g transform="translate(24, 0)">
    <!-- Perspective Grid Plane -->
    <line x1="20" y1="120" x2="158" y2="120" stroke="#22242a" stroke-width="1" />
    <line x1="40" y1="100" x2="138" y2="100" stroke="#22242a" stroke-width="0.8" />
    
    <g class="spin-orbit">
      <circle cx="89" cy="80" r="32" fill="none" stroke="#22242a" stroke-width="1" />
      <circle cx="89" cy="80" r="22" fill="none" stroke="#2563eb" stroke-width="1" stroke-dasharray="4 4" />
      <circle cx="111" cy="80" r="3" fill="#2563eb" />
      <polygon points="89,64 102,88 76,88" fill="none" stroke="#f5f5f7" stroke-width="1" />
    </g>

    <text x="89" y="142" text-anchor="middle" class="mono" font-size="7.5" fill="#71717a">WEBGL // THREE.JS SHADERS</text>
  </g>

  <!-- Right: Project Editorial Content -->
  <g transform="translate(180, 26)">
    <text class="mono" font-size="10" font-weight="700" fill="#a1a1aa" letter-spacing="1">PROJECT 06 // SPATIAL ARCHITECTURE &amp; 3D SCENE</text>
    <text y="22" class="sans" font-size="18" font-weight="800" fill="#f5f5f7">Oggy 3D Interactive World</text>
    <text y="42" class="sans" font-size="11.5" fill="#a1a1aa">
      Interactive 3D web exploration environment of the iconic Oggy house model with WebGL shaders, OrbitControls camera manipulation, directional scene lighting, and responsive viewport sizing.
    </text>

    <!-- Technical Badges -->
    <g transform="translate(0, 68)">
      <rect x="0" y="0" width="88" height="20" rx="2" fill="#141518" stroke="#22242a" stroke-width="1" />
      <text x="44" y="13" text-anchor="middle" class="mono" font-size="8.5" fill="#f5f5f7">JavaScript</text>

      <rect x="96" y="0" width="76" height="20" rx="2" fill="#141518" stroke="#22242a" stroke-width="1" />
      <text x="134" y="13" text-anchor="middle" class="mono" font-size="8.5" fill="#2563eb">Three.js</text>

      <rect x="180" y="0" width="60" height="20" rx="2" fill="#141518" stroke="#22242a" stroke-width="1" />
      <text x="210" y="13" text-anchor="middle" class="mono" font-size="8.5" fill="#f5f5f7">WebGL</text>

      <rect x="248" y="0" width="95" height="20" rx="2" fill="#141518" stroke="#22242a" stroke-width="1" />
      <text x="295" y="13" text-anchor="middle" class="mono" font-size="8.5" fill="#f5f5f7">OrbitControls</text>

      <rect x="351" y="0" width="85" height="20" rx="2" fill="#141518" stroke="#22242a" stroke-width="1" />
      <text x="393" y="13" text-anchor="middle" class="mono" font-size="8.5" fill="#f5f5f7">HTML5/CSS3</text>
    </g>

    <text y="108" class="mono" font-size="9" fill="#10b981">
      &#10003; LIVE 3D EXPLORATION ENVIRONMENT
    </text>
  </g>
</svg>