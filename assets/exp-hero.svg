<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" width="100%" height="100%">
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace; }

      /* Kinetic path stroke drawing on main brand */
      @keyframes strokeReveal {
        0% { stroke-dashoffset: 1200; opacity: 0.2; }
        50% { stroke-dashoffset: 0; opacity: 1; }
        100% { stroke-dashoffset: 0; opacity: 0.9; }
      }
      .brand-stroke {
        stroke-dasharray: 1200;
        animation: strokeReveal 7s cubic-bezier(0.16, 1, 0.3, 1) infinite alternate;
      }

      /* Slow mechanical compass rotation */
      @keyframes orbitSlow {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .mech-spin {
        transform-origin: 780px 200px;
        animation: orbitSlow 32s linear infinite;
      }

      /* Infinite Marquee Ticker */
      @keyframes marqueeSlide {
        0% { transform: translateX(0); }
        100% { transform: translateX(-50%); }
      }
      .marquee-tape {
        display: inline-block;
        animation: marqueeSlide 26s linear infinite;
      }

      /* 3D Wireframe Line Morph */
      @keyframes wireMorph {
        0%, 100% { transform: scale(1) rotate(0deg); opacity: 0.7; }
        50% { transform: scale(1.08) rotate(4deg); opacity: 1; }
      }
      .wire-morph {
        transform-origin: 780px 200px;
        animation: wireMorph 6s ease-in-out infinite;
      }

      /* Subtle Pulse Glint */
      @keyframes dotPulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.85); }
      }
      .blue-dot {
        transform-origin: 48px 48px;
        animation: dotPulse 2s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Deep Void Background -->
  <rect width="940" height="440" fill="#060709" />

  <!-- Outer Hairline Structural Grid -->
  <rect x="20" y="20" width="900" height="400" fill="none" stroke="#181a22" stroke-width="1" />

  <!-- Top Editorial Folio -->
  <g transform="translate(44, 52)">
    <circle class="blue-dot" cx="4" cy="4" r="3.5" fill="#2563eb" />
    <text x="18" y="7" class="mono" font-size="11" font-weight="700" fill="#f3f3f6" letter-spacing="1.5">SHABER MOHAMAD B.</text>
    <text x="220" y="7" class="mono" font-size="11" fill="#52525b">&#8212;</text>
    <text x="245" y="7" class="mono" font-size="11" font-weight="600" fill="#3b82f6" letter-spacing="1">FULL-STACK DEVELOPER</text>
    <text x="460" y="7" class="mono" font-size="11" fill="#52525b">&#8212;</text>
    <text x="485" y="7" class="mono" font-size="11" fill="#71717a">B.TECH AI &amp; DS</text>
    <text x="852" y="7" class="mono" font-size="11" fill="#a1a1aa" text-anchor="end">TAMIL NADU, IN</text>
  </g>

  <!-- Horizontal Hairline Separator -->
  <line x1="20" y1="74" x2="920" y2="74" stroke="#181a22" stroke-width="1" />

  <!-- ================= HUGE TYPOGRAPHIC COMPOSITION ================= -->
  <g transform="translate(44, 190)">
    <!-- Massive Oversized Typography: SHABER. -->
    <text y="0" class="sans" font-size="96" font-weight="900" fill="#f3f3f6" letter-spacing="-3">
      SHABER<tspan fill="#2563eb">.</tspan>
    </text>
    <!-- Vector Stroke Overlay -->
    <text y="0" class="sans brand-stroke" font-size="96" font-weight="900" fill="none" stroke="#2563eb" stroke-width="1.5" letter-spacing="-3">
      SHABER.
    </text>

    <!-- Role Subtitle -->
    <text y="42" class="mono" font-size="15" font-weight="700" fill="#3b82f6" letter-spacing="2.5">
      FULL-STACK DEVELOPER.
    </text>

    <!-- Required Headline -->
    <text y="92" class="sans" font-size="28" font-weight="700" fill="#ffffff" letter-spacing="-0.5">
      &#8220;I build digital things.&#8221;
    </text>

    <!-- Minimal Narrative -->
    <text y="128" class="sans" font-size="14" font-weight="400" fill="#a1a1aa">
      Distributed real-time systems, spatial 3D WebGL experiences &amp; full-stack software.
    </text>
  </g>

  <!-- ================= RIGHT EXPERIMENTAL GEOMETRIC ARTWORK ================= -->
  <g class="mech-spin">
    <circle cx="780" cy="200" r="80" fill="none" stroke="#181a22" stroke-width="1" />
    <circle cx="780" cy="200" r="64" fill="none" stroke="#272a36" stroke-width="1" stroke-dasharray="4 6" />
    <circle cx="780" cy="200" r="44" fill="none" stroke="#181a22" stroke-width="1" />
    <circle cx="780" cy="200" r="4" fill="#2563eb" />
    <line x1="680" y1="200" x2="880" y2="200" stroke="#181a22" stroke-width="1" />
    <line x1="780" y1="100" x2="780" y2="300" stroke="#181a22" stroke-width="1" />
  </g>

  <!-- Wireframe Morphing Polyhedron in Center -->
  <g class="wire-morph">
    <polygon points="780,160 816,180 816,220 780,240 744,220 744,180" fill="none" stroke="#2563eb" stroke-width="1.4" />
    <line x1="780" y1="200" x2="780" y2="240" stroke="#52525b" stroke-width="1" />
    <line x1="780" y1="200" x2="816" y2="180" stroke="#52525b" stroke-width="1" />
    <line x1="780" y1="200" x2="744" y2="180" stroke="#52525b" stroke-width="1" />
    <circle cx="780" cy="200" r="2.5" fill="#f3f3f6" />
  </g>

  <!-- Bottom Hairline Separator -->
  <line x1="20" y1="376" x2="920" y2="376" stroke="#181a22" stroke-width="1" />

  <!-- Bottom Continuous Typography Marquee Tape -->
  <g transform="translate(0, 402)">
    <g class="marquee-tape">
      <text class="mono" font-size="11" font-weight="600" fill="#71717a" letter-spacing="2">
        SHABER MOHAMAD B. &#8226; FULL-STACK DEVELOPER &#8226; REAL-TIME WEBSOCKETS &#8226; THREE.JS WEBGL &#8226; PYTHON &amp; EDA &#8226; STELLA MARY&apos;S COLLEGE OF ENGINEERING &#8226; TAMIL NADU, INDIA &#8226; SHABER MOHAMAD B. &#8226; FULL-STACK DEVELOPER &#8226; REAL-TIME WEBSOCKETS &#8226; THREE.JS WEBGL &#8226; PYTHON &amp; EDA &#8226; STELLA MARY&apos;S COLLEGE OF ENGINEERING &#8226; TAMIL NADU, INDIA &#8226;&#160;
      </text>
    </g>
  </g>
</svg>