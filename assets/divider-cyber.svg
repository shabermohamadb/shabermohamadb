<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 24" width="100%" height="24">
  <defs>
    <style>
      @keyframes cyberPulse {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 1; }
      }
      @keyframes packetSlide {
        0% { transform: translateX(0); }
        100% { transform: translateX(860px); }
      }
      .dot-1 { animation: cyberPulse 2s infinite 0.2s; }
      .dot-2 { animation: cyberPulse 2s infinite 0.6s; }
      .dot-3 { animation: cyberPulse 2s infinite 1.0s; }
      .packet { animation: packetSlide 4s linear infinite; }
    </style>
  </defs>

  <line x1="20" y1="12" x2="880" y2="12" stroke="#181D2E" stroke-width="1" stroke-dasharray="4 4" />
  <circle class="packet" cx="20" cy="12" r="2.5" fill="#7DCFFF" />
  
  <g transform="translate(425, 6)">
    <rect width="50" height="12" rx="2" fill="#0C101F" stroke="#252D48" stroke-width="1" />
    <circle class="dot-1" cx="12" cy="6" r="1.8" fill="#7DCFFF" />
    <circle class="dot-2" cx="25" cy="6" r="1.8" fill="#BB9AF7" />
    <circle class="dot-3" cx="38" cy="6" r="1.8" fill="#E0AF68" />
  </g>
</svg>