<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 30" width="100%" height="30">
  <defs>
    <linearGradient id="divCyber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0" />
      <stop offset="30%" stop-color="#00f0ff" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="1" />
      <stop offset="70%" stop-color="#00f0ff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0" />
    </linearGradient>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace; }
      @keyframes scanSweepDiv {
        0% { transform: translateX(-200px); }
        100% { transform: translateX(1100px); }
      }
      .div-sweep { animation: scanSweepDiv 4s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
    </style>
  </defs>

  <!-- Baseline Conduit -->
  <line x1="0" y1="15" x2="940" y2="15" stroke="url(#divCyber)" stroke-width="1" />
  
  <!-- Sweeping Glint -->
  <circle class="div-sweep" cx="0" cy="15" r="3" fill="#ffffff" />

  <!-- Center HUD Diamond -->
  <polygon points="470,8 477,15 470,22 463,15" fill="#060c18" stroke="#00f0ff" stroke-width="1.2" />
  <circle cx="470" cy="15" r="1.5" fill="#00f0ff" />

  <!-- Technical Wing Ticks -->
  <line x1="420" y1="11" x2="430" y2="15" stroke="#38bdf8" stroke-width="1" />
  <line x1="420" y1="19" x2="430" y2="15" stroke="#38bdf8" stroke-width="1" />
  <line x1="520" y1="11" x2="510" y2="15" stroke="#38bdf8" stroke-width="1" />
  <line x1="520" y1="19" x2="510" y2="15" stroke="#38bdf8" stroke-width="1" />
</svg>