<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="100%" height="100%">
  <defs>
    <linearGradient id="telBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0E17" />
      <stop offset="100%" stop-color="#07090F" />
    </linearGradient>
    <style>
      .mono { font-family: ui-monospace, 'JetBrains Mono', monospace; }
      .sans { font-family: system-ui, -apple-system, 'SF Pro Display', Inter, sans-serif; }
      .num { font-family: system-ui, -apple-system, sans-serif; font-size: 26px; font-weight: 800; fill: #FFFFFF; }
      .lbl { font-family: ui-monospace, monospace; font-size: 9.5px; font-weight: 600; fill: #64748B; letter-spacing: 1.5px; }
      .sub { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #94A3B8; }
    </style>
  </defs>

  <rect width="900" height="200" rx="10" fill="url(#telBg)" stroke="#1A202E" stroke-width="1" />

  <!-- HEADER -->
  <text x="36" y="32" class="mono" font-size="10.5" font-weight="600" fill="#38BDF8" letter-spacing="2">// 03 GITHUB TELEMETRY &amp; CODEBASE METRICS</text>
  <line x1="36" y1="44" x2="864" y2="44" stroke="#161B28" stroke-width="1" />

  <!-- METRIC TILES (4 tiles) -->
  <!-- Tile 1: Repos -->
  <g transform="translate(36, 58)">
    <rect width="186" height="74" rx="6" fill="#101420" stroke="#1C2436" stroke-width="1" />
    <text x="16" y="24" class="lbl">PUBLIC REPOSITORIES</text>
    <text x="16" y="54" class="num">33<tspan font-size="16" font-weight="400" fill="#38BDF8">+</tspan></text>
    <text x="74" y="52" class="sub">Open Source</text>
  </g>

  <!-- Tile 2: Primary Architecture -->
  <g transform="translate(242, 58)">
    <rect width="206" height="74" rx="6" fill="#101420" stroke="#1C2436" stroke-width="1" />
    <text x="16" y="24" class="lbl">DEVELOPMENT FOCUS</text>
    <text x="16" y="52" class="sans" font-size="17" font-weight="800" fill="#F8FAFC">Full-Stack &amp; AI</text>
    <text x="16" y="66" class="sub">Web Systems • ML</text>
  </g>

  <!-- Tile 3: Core Frameworks -->
  <g transform="translate(468, 58)">
    <rect width="206" height="74" rx="6" fill="#101420" stroke="#1C2436" stroke-width="1" />
    <text x="16" y="24" class="lbl">PRIMARY ECOSYSTEMS</text>
    <text x="16" y="52" class="sans" font-size="17" font-weight="800" fill="#F8FAFC">React · Node · Python</text>
    <text x="16" y="66" class="sub">Next.js • Express • Pandas</text>
  </g>

  <!-- Tile 4: Status -->
  <g transform="translate(694, 58)">
    <rect width="170" height="74" rx="6" fill="#101420" stroke="#1C2436" stroke-width="1" />
    <text x="16" y="24" class="lbl">OPERATIONAL STATUS</text>
    <circle cx="24" cy="50" r="4.5" fill="#10B981" />
    <text x="36" y="54" class="sans" font-size="15" font-weight="700" fill="#10B981">Active</text>
    <text x="16" y="66" class="sub">Tamil Nadu, India</text>
  </g>

  <!-- LANGUAGE DISTRIBUTION BAR -->
  <g transform="translate(36, 146)">
    <!-- Segment Bar -->
    <rect width="360" height="8" rx="4" fill="#F7DF1E" /> <!-- JS 45% (360px of 800) -->
    <rect x="364" width="200" height="8" rx="4" fill="#3178C6" /> <!-- TS 25% (200px) -->
    <rect x="568" width="160" height="8" rx="4" fill="#DA5B0B" /> <!-- Jupyter/Py 20% (160px) -->
    <rect x="732" width="96" height="8" rx="4" fill="#38BDF8" /> <!-- Python/CSS/Other 10% (96px) -->

    <!-- Legend -->
    <g transform="translate(0, 24)">
      <circle cx="6" cy="6" r="3.5" fill="#F7DF1E" />
      <text x="16" y="10" class="mono" font-size="10.5" fill="#E2E8F0">JavaScript (45%)</text>

      <circle cx="160" cy="6" r="3.5" fill="#3178C6" />
      <text x="170" y="10" class="mono" font-size="10.5" fill="#E2E8F0">TypeScript (25%)</text>

      <circle cx="320" cy="6" r="3.5" fill="#DA5B0B" />
      <text x="330" y="10" class="mono" font-size="10.5" fill="#E2E8F0">Python &amp; ML (20%)</text>

      <circle cx="480" cy="6" r="3.5" fill="#38BDF8" />
      <text x="490" y="10" class="mono" font-size="10.5" fill="#E2E8F0">WebGL &amp; CSS (10%)</text>
    </g>
  </g>
</svg>