<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <linearGradient id="p3Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0D14" />
      <stop offset="100%" stop-color="#06070B" />
    </linearGradient>
    <style>
      .mono { font-family: ui-monospace, 'JetBrains Mono', monospace; }
      .sans { font-family: system-ui, -apple-system, 'SF Pro Display', Inter, sans-serif; }
    </style>
  </defs>

  <rect width="900" height="240" rx="10" fill="url(#p3Bg)" stroke="#1A202E" stroke-width="1" />

  <g transform="translate(32, 28)">
    <text x="0" y="16" class="mono" font-size="10" font-weight="600" fill="#EC4899" letter-spacing="2">PROJECT 03 // MULTIPLAYER WEBGL ARENA</text>
    <text x="0" y="44" class="sans" font-size="22" font-weight="800" fill="#FFFFFF">Hidden Number — Social Deduction Game</text>
    <text x="0" y="70" class="sans" font-size="13" fill="#94A3B8">Real-time multiplayer social deduction arena built with Three.js 3D spatial depth.</text>
    <text x="0" y="88" class="sans" font-size="13" fill="#94A3B8">Each player's unique secret number is veiled from themselves but visible to others.</text>

    <!-- Meta Chips -->
    <g transform="translate(0, 114)">
      <rect width="94" height="24" rx="4" fill="#131722" stroke="#242C3F" stroke-width="1" />
      <text x="47" y="16" text-anchor="middle" class="mono" font-size="10.5" fill="#38BDF8">TypeScript</text>

      <rect x="102" width="80" height="24" rx="4" fill="#131722" stroke="#242C3F" stroke-width="1" />
      <text x="142" y="16" text-anchor="middle" class="mono" font-size="10.5" fill="#EC4899">Three.js</text>

      <rect x="190" width="84" height="24" rx="4" fill="#131722" stroke="#242C3F" stroke-width="1" />
      <text x="232" y="16" text-anchor="middle" class="mono" font-size="10.5" fill="#818CF8">Socket.IO</text>

      <rect x="282" width="66" height="24" rx="4" fill="#131722" stroke="#242C3F" stroke-width="1" />
      <text x="315" y="16" text-anchor="middle" class="mono" font-size="10.5" fill="#E2E8F0">React</text>

      <rect x="356" width="94" height="24" rx="4" fill="#131722" stroke="#242C3F" stroke-width="1" />
      <text x="403" y="16" text-anchor="middle" class="mono" font-size="10.5" fill="#E2E8F0">Tailwind CSS</text>
    </g>

    <g transform="translate(0, 154)">
      <text x="0" y="14" class="mono" font-size="11" font-weight="600" fill="#10B981">LIVE DEPLOYMENT: hidden-number.vercel.app ↗</text>
    </g>
  </g>

  <!-- Right Side: 3D Spatial deduction arena wireframe -->
  <g transform="translate(540, 26)">
    <rect width="324" height="186" rx="8" fill="#0D1017" stroke="#1E2536" stroke-width="1" />
    <text x="18" y="24" class="mono" font-size="9.5" fill="#64748B" letter-spacing="1">CRYPTOGRAPHIC VEIL TOPOLOGY</text>

    <!-- 3D Arena Box / Perspective Grid -->
    <polygon points="40,110 160,50 280,110 160,165" fill="#121622" stroke="#2B364C" stroke-width="1" />
    <line x1="160" y1="50" x2="160" y2="165" stroke="#1F283A" stroke-width="1" />

    <!-- Player 1 Token (Concealed Number) -->
    <circle cx="160" cy="105" r="18" fill="#1E162A" stroke="#EC4899" stroke-width="1.5" />
    <text x="160" y="110" text-anchor="middle" class="mono" font-size="13" font-weight="700" fill="#EC4899">[ ? ]</text>
    <text x="160" y="136" text-anchor="middle" class="mono" font-size="8.5" fill="#94A3B8">PLAYER (VEILED)</text>

    <!-- Competitor Eye Icons / Vectors -->
    <circle cx="70" cy="80" r="10" fill="#141A28" stroke="#38BDF8" stroke-width="1" />
    <text x="70" y="84" text-anchor="middle" class="mono" font-size="8" fill="#38BDF8">P2</text>
    <line x1="82" y1="84" x2="142" y2="102" stroke="#38BDF8" stroke-width="1" stroke-dasharray="2 2" />

    <circle cx="250" cy="80" r="10" fill="#141A28" stroke="#818CF8" stroke-width="1" />
    <text x="250" y="84" text-anchor="middle" class="mono" font-size="8" fill="#818CF8">P3</text>
    <line x1="238" y1="84" x2="178" y2="102" stroke="#818CF8" stroke-width="1" stroke-dasharray="2 2" />

    <!-- Telemetry -->
    <rect x="18" y="146" width="288" height="28" rx="4" fill="#0A0D14" stroke="#1B2232" stroke-width="1" />
    <text x="26" y="164" class="mono" font-size="8.5" fill="#EC4899">&gt; Multiplayer Room: Synced • WebGL Canvas: 60 FPS</text>
  </g>
</svg>