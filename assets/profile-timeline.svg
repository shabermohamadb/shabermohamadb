<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" width="100%" height="100%">
  <defs>
    <linearGradient id="ptBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04060b" />
      <stop offset="50%" stop-color="#070c17" />
      <stop offset="100%" stop-color="#030408" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b1326" />
      <stop offset="100%" stop-color="#060914" />
    </linearGradient>

    <linearGradient id="spineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#0070f3" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; }

      /* Hologram ring spin */
      @keyframes spinRing {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .holo-ring {
        transform-origin: 155px 155px;
        animation: spinRing 12s linear infinite;
      }
      .holo-ring-rev {
        transform-origin: 155px 155px;
        animation: spinRing 8s linear infinite reverse;
      }

      /* Pulse traveling along vertical timeline spine */
      @keyframes pulseDown {
        0% { transform: translateY(0); opacity: 0; }
        15% { opacity: 1; }
        85% { opacity: 1; }
        100% { transform: translateY(270px); opacity: 0; }
      }
      .spine-pulse {
        animation: pulseDown 3.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      /* Milestone Node Glow */
      @keyframes nodeGlow {
        0%, 100% { r: 6px; opacity: 0.8; }
        50% { r: 9px; opacity: 1; }
      }
      .glow-node { animation: nodeGlow 2s ease-in-out infinite; }

      @keyframes pulseRingNode {
        0% { r: 8px; opacity: 0.9; }
        100% { r: 20px; opacity: 0; }
      }
      .pulse-ring { animation: pulseRingNode 2.2s cubic-bezier(0.2, 0.8, 0.2, 1) infinite; }
    </style>
  </defs>

  <!-- Base Panel -->
  <rect width="940" height="400" fill="url(#ptBg)" rx="8" stroke="#1e293b" stroke-width="1" />

  <!-- Corner Brackets -->
  <path d="M 12 32 L 12 12 L 32 12" fill="none" stroke="#00f0ff" stroke-width="2" />
  <path d="M 908 12 L 928 12 L 928 32" fill="none" stroke="#00f0ff" stroke-width="2" />
  <path d="M 12 368 L 12 388 L 32 388" fill="none" stroke="#00f0ff" stroke-width="2" />
  <path d="M 908 388 L 928 388 L 928 368" fill="none" stroke="#00f0ff" stroke-width="2" />

  <!-- Section Header -->
  <g transform="translate(36, 38)">
    <text class="mono" font-size="11" font-weight="700" fill="#00f0ff" letter-spacing="2.5">SECTION 02 // DEVELOPER DOSSIER</text>
    <text class="sans" x="0" y="24" font-size="20" font-weight="800" fill="#ffffff" letter-spacing="0.5">TECHNICAL IDENTITY &amp; EVOLUTION</text>
  </g>

  <!-- LEFT ASYMMETRIC CARD: Holographic Dossier -->
  <g transform="translate(36, 88)">
    <!-- Container Box -->
    <rect width="280" height="280" rx="6" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1" />
    <rect width="280" height="2" fill="#00f0ff" opacity="0.8" />

    <!-- Hologram Ring Graphic -->
    <g transform="translate(-15, -15)">
      <circle cx="155" cy="115" r="46" fill="#040814" stroke="#1e293b" stroke-width="1.2" />
      <circle class="holo-ring" cx="155" cy="115" r="40" fill="none" stroke="#00f0ff" stroke-width="1" stroke-dasharray="14 10 4 8" opacity="0.7" />
      <circle class="holo-ring-rev" cx="155" cy="115" r="32" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="8 6 12 4" opacity="0.6" />
      <circle cx="155" cy="115" r="22" fill="#0a162e" stroke="#00f0ff" stroke-width="1" />
      
      <!-- Core Initials Symbol -->
      <text x="155" y="122" text-anchor="middle" class="mono" font-size="15" font-weight="800" fill="#00f0ff" letter-spacing="1">SMB</text>
    </g>

    <!-- Identity Telemetry Rows -->
    <g transform="translate(20, 168)">
      <text class="mono" font-size="9" font-weight="700" fill="#64748b" letter-spacing="1.5">EDUCATION</text>
      <text y="14" class="sans" font-size="11.5" font-weight="700" fill="#ffffff">B.Tech AI &amp; Data Science</text>
      <text y="28" class="sans" font-size="10.5" fill="#94a3b8">Stella Mary&apos;s College of Eng.</text>

      <text y="52" class="mono" font-size="9" font-weight="700" fill="#64748b" letter-spacing="1.5">SPECIALIZATION</text>
      <text y="66" class="sans" font-size="11.5" font-weight="700" fill="#38bdf8">Full-Stack Real-Time Systems</text>
      <text y="80" class="sans" font-size="10.5" fill="#94a3b8">Distributed WebSockets &amp; WebGL</text>

      <text y="102" class="mono" font-size="8.5" fill="#10b981" font-weight="700" letter-spacing="1">● STATUS: ACTIVE DEVELOPMENT</text>
    </g>
  </g>

  <!-- RIGHT COLUMN: Animated Vertical Timeline -->
  <g transform="translate(360, 92)">
    <!-- Vertical Spine Line -->
    <line x1="20" y1="10" x2="20" y2="280" stroke="url(#spineGrad)" stroke-width="2" opacity="0.4" />
    <line x1="20" y1="10" x2="20" y2="280" stroke="#00f0ff" stroke-width="1" stroke-dasharray="4 6" opacity="0.6" />

    <!-- Animated Pulse Traveling Down the Spine -->
    <g class="spine-pulse">
      <circle cx="20" cy="10" r="4.5" fill="#00f0ff" />
      <circle cx="20" cy="10" r="10" fill="none" stroke="#00f0ff" stroke-width="1" opacity="0.6" />
    </g>

    <!-- TIMELINE NODE 1: Academic & AI Foundations -->
    <g transform="translate(0, 10)">
      <!-- Node Indicator -->
      <circle class="pulse-ring" cx="20" cy="12" fill="none" stroke="#00f0ff" stroke-width="1.5" />
      <circle class="glow-node" cx="20" cy="12" r="6" fill="#00f0ff" />
      <circle cx="20" cy="12" r="2.5" fill="#ffffff" />

      <!-- Content Box -->
      <g transform="translate(48, 0)">
        <rect width="490" height="74" rx="5" fill="#070d1c" stroke="#1e293b" stroke-width="1" />
        <rect width="3" height="74" rx="1" fill="#00f0ff" />
        <text x="16" y="20" class="mono" font-size="9.5" font-weight="700" fill="#00f0ff" letter-spacing="1.5">2022 &#8212; 2026 // ACADEMIC FOUNDATIONS</text>
        <text x="16" y="38" class="sans" font-size="13" font-weight="800" fill="#ffffff">B.Tech Artificial Intelligence &amp; Data Science</text>
        <text x="16" y="56" class="sans" font-size="11" fill="#94a3b8">
          Deep computational modeling at Stella Mary&apos;s College of Engineering: neural networks, data structures &amp; algorithmic logic.
        </text>
      </g>
    </g>

    <!-- TIMELINE NODE 2: Full-Stack & Commercial Engines -->
    <g transform="translate(0, 102)">
      <!-- Node Indicator -->
      <circle class="pulse-ring" cx="20" cy="12" fill="none" stroke="#38bdf8" stroke-width="1.5" />
      <circle class="glow-node" cx="20" cy="12" r="6" fill="#38bdf8" />
      <circle cx="20" cy="12" r="2.5" fill="#ffffff" />

      <!-- Content Box -->
      <g transform="translate(48, 0)">
        <rect width="490" height="74" rx="5" fill="#070d1c" stroke="#1e293b" stroke-width="1" />
        <rect width="3" height="74" rx="1" fill="#38bdf8" />
        <text x="16" y="20" class="mono" font-size="9.5" font-weight="700" fill="#38bdf8" letter-spacing="1.5">2024 &#8212; 2025 // PRODUCTION COMMERCE &amp; AUTOMATION</text>
        <text x="16" y="38" class="sans" font-size="13" font-weight="800" fill="#ffffff">Commercial Food Engine &amp; Workflow Systems</text>
        <text x="16" y="56" class="sans" font-size="11" fill="#94a3b8">
          Shipped Floz Food Ordering for A-One Shawarma Spot and Al-Ameen Automation portal with dynamic PDF synthesis &amp; Supabase.
        </text>
      </g>
    </g>

    <!-- TIMELINE NODE 3: Distributed Concurrency & Spatial 3D -->
    <g transform="translate(0, 194)">
      <!-- Node Indicator -->
      <circle class="pulse-ring" cx="20" cy="12" fill="none" stroke="#00f0ff" stroke-width="1.5" />
      <circle class="glow-node" cx="20" cy="12" r="6" fill="#00f0ff" />
      <circle cx="20" cy="12" r="2.5" fill="#ffffff" />

      <!-- Content Box -->
      <g transform="translate(48, 0)">
        <rect width="490" height="74" rx="5" fill="#070d1c" stroke="#1e293b" stroke-width="1" />
        <rect width="3" height="74" rx="1" fill="#00f0ff" />
        <text x="16" y="20" class="mono" font-size="9.5" font-weight="700" fill="#00f0ff" letter-spacing="1.5">2025 &#8212; 2026 // REAL-TIME CONCURRENCY &amp; 3D SYSTEMS</text>
        <text x="16" y="38" class="sans" font-size="13" font-weight="800" fill="#ffffff">CollabSpace, Hidden Number 3D &amp; CircuitX EDA</text>
        <text x="16" y="56" class="sans" font-size="11" fill="#94a3b8">
          Engineered sub-millisecond Socket.IO multi-user sync with AI threads, Three.js WebGL deduction games, and PySide6 EDA routing.
        </text>
      </g>
    </g>
  </g>
</svg>