<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 180" width="100%" height="100%">
  <defs>
    <linearGradient id="twilightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050710" />
      <stop offset="45%" stop-color="#0D1226" />
      <stop offset="85%" stop-color="#141935" />
      <stop offset="100%" stop-color="#070912" />
    </linearGradient>

    <style>
      .f-heading { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 17px; font-weight: 800; fill: #FFFFFF; letter-spacing: 0.5px; }
      .f-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12.5px; fill: #94A3B8; }
      @keyframes starTwinkle {
        0%, 100% { opacity: 0.2; transform: scale(0.8); }
        50% { opacity: 1; transform: scale(1.3); }
      }
      @keyframes cloudDrift {
        0% { transform: translateX(-150px); }
        100% { transform: translateX(950px); }
      }
      @keyframes lanternPulse {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }
      .star-1 { animation: starTwinkle 3s ease-in-out infinite; }
      .star-2 { animation: starTwinkle 2.5s ease-in-out infinite 0.8s; }
      .star-3 { animation: starTwinkle 3.5s ease-in-out infinite 1.4s; }
      .cloud { animation: cloudDrift 45s linear infinite; }
      .lantern { animation: lanternPulse 3s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="840" height="180" rx="12" fill="url(#twilightSky)" stroke="#1A2035" stroke-width="1" />
  <circle cx="720" cy="50" r="28" fill="#F1F5F9" opacity="0.9" />
  <circle cx="712" cy="45" r="24" fill="#0D1226" />

  <circle class="star-1" cx="80" cy="35" r="1.5" fill="#FFFFFF" />
  <circle class="star-2" cx="190" cy="25" r="1.2" fill="#7DCFFF" />
  <circle class="star-3" cx="320" cy="45" r="1.5" fill="#BB9AF7" />
  <circle class="star-1" cx="440" cy="20" r="1.2" fill="#FFFFFF" />
  <circle class="star-2" cx="580" cy="35" r="1.5" fill="#7DCFFF" />
  <circle class="star-3" cx="790" cy="30" r="1.2" fill="#E0AF68" />

  <path class="cloud" d="M 0 45 Q 30 35 60 45 Q 90 35 120 45 Q 140 55 120 65 Q 60 70 0 65 Z" fill="#BB9AF7" opacity="0.08" />

  <rect x="0" y="110" width="840" height="70" fill="#080A14" />
  <rect x="60" y="90" width="35" height="40" fill="#0C0F1E" />
  <rect x="110" y="75" width="45" height="55" fill="#0E1224" />
  <rect x="180" y="85" width="30" height="45" fill="#0A0D18" />
  <rect x="640" y="80" width="50" height="50" fill="#0E1224" />
  <rect x="710" y="70" width="40" height="60" fill="#0C0F1E" />
  <rect x="765" y="88" width="35" height="42" fill="#0A0D18" />

  <circle cx="125" cy="85" r="1.5" fill="#E0AF68" class="lantern" />
  <circle cx="660" cy="90" r="1.5" fill="#7DCFFF" class="lantern" />
  <circle cx="730" cy="80" r="1.5" fill="#BB9AF7" class="lantern" />

  <line x1="20" y1="140" x2="820" y2="140" stroke="#1D243B" stroke-width="2" />
  <line x1="20" y1="155" x2="820" y2="155" stroke="#1D243B" stroke-width="1" />
  <line x1="100" y1="140" x2="100" y2="180" stroke="#1D243B" stroke-width="1.5" />
  <line x1="250" y1="140" x2="250" y2="180" stroke="#1D243B" stroke-width="1.5" />
  <line x1="400" y1="140" x2="400" y2="180" stroke="#1D243B" stroke-width="1.5" />
  <line x1="550" y1="140" x2="550" y2="180" stroke="#1D243B" stroke-width="1.5" />
  <line x1="700" y1="140" x2="700" y2="180" stroke="#1D243B" stroke-width="1.5" />

  <g fill="#070912">
    <path d="M 160 140 Q 170 110 185 110 Q 200 110 210 140 Z" />
    <circle cx="185" cy="95" r="11" />
    <path d="M 175 90 Q 185 75 200 85 Q 205 95 195 105 Z" />
  </g>

  <rect x="220" y="132" width="7" height="9" rx="1" fill="#1B2238" />
  <path d="M 223 129 Q 225 125 222 121" fill="none" stroke="#7DCFFF" stroke-width="0.75" opacity="0.6" />

  <g transform="translate(480, 75)">
    <text x="0" y="0" text-anchor="middle" class="f-heading">Let&#8217;s Build Something Extraordinary.</text>
    <text x="0" y="24" text-anchor="middle" class="f-sub">Open for full-stack engineering roles, AI collaborations &amp; creative projects.</text>
  </g>
</svg>