<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 180" width="100%" height="100%">
  <defs>
    <linearGradient id="ftBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#04060c" />
      <stop offset="60%" stop-color="#080e1e" />
      <stop offset="100%" stop-color="#020306" />
    </linearGradient>

    <radialGradient id="ftSun" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#0070f3" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; }
      @keyframes radarSweepFooter {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .sweep-arm { transform-origin: 470px 30px; animation: radarSweepFooter 6s linear infinite; }
    </style>
  </defs>

  <rect width="940" height="180" fill="url(#ftBg)" rx="8" stroke="#1e293b" stroke-width="1" />
  <circle cx="470" cy="30" r="160" fill="url(#ftSun)" />

  <!-- Horizon Line -->
  <line x1="0" y1="30" x2="940" y2="30" stroke="#00f0ff" stroke-width="1.2" opacity="0.6" />

  <!-- Perspective Floor Grid converging to (470, 30) -->
  <g stroke="#00f0ff" stroke-width="0.6" opacity="0.25">
    <line x1="470" y1="30" x2="0" y2="180" />
    <line x1="470" y1="30" x2="160" y2="180" />
    <line x1="470" y1="30" x2="320" y2="180" />
    <line x1="470" y1="30" x2="470" y2="180" />
    <line x1="470" y1="30" x2="620" y2="180" />
    <line x1="470" y1="30" x2="780" y2="180" />
    <line x1="470" y1="30" x2="940" y2="180" />

    <line x1="0" y1="50"  x2="940" y2="50"  stroke-width="0.6" />
    <line x1="0" y1="80"  x2="940" y2="80"  stroke-width="0.8" />
    <line x1="0" y1="120" x2="940" y2="120" stroke-width="1.0" />
    <line x1="0" y1="170" x2="940" y2="170" stroke-width="1.2" />
  </g>

  <!-- Central Radar Emitter -->
  <circle cx="470" cy="30" r="24" fill="none" stroke="#00f0ff" stroke-width="0.8" opacity="0.5" />
  <line class="sweep-arm" x1="470" y1="30" x2="494" y2="30" stroke="#00f0ff" stroke-width="1.5" />
  <circle cx="470" cy="30" r="3" fill="#ffffff" />

  <!-- Typography -->
  <g transform="translate(470, 85)">
    <text text-anchor="middle" class="mono" font-size="9" font-weight="700" fill="#00f0ff" letter-spacing="3">
      // TRANSMISSION CHANNEL OPEN //
    </text>
    <text text-anchor="middle" y="24" class="sans" font-size="18" font-weight="900" fill="#ffffff" letter-spacing="1">
      SHABER MOHAMAD B
    </text>
    <text text-anchor="middle" y="42" class="sans" font-size="11.5" fill="#94a3b8">
      Full-Stack Developer &#8226; AI &amp; Data Science &#8226; Stella Mary&apos;s College of Engineering
    </text>
    <text text-anchor="middle" y="58" class="mono" font-size="9" fill="#38bdf8" letter-spacing="1">
      TAMIL NADU, INDIA &#8226; LAT 08°10&apos;N LON 77°25&apos;E &#8226; SYSTEM.ONLINE
    </text>
  </g>
</svg>