<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 460" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="spaceBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030509" />
      <stop offset="50%" stop-color="#060a14" />
      <stop offset="100%" stop-color="#020306" />
    </linearGradient>

    <!-- Central Core Glow -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.3" />
      <stop offset="40%" stop-color="#0070f3" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; }

      /* Orbital Rotation */
      @keyframes orbitClockwise {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes orbitCounter {
        0% { transform: rotate(360deg); }
        100% { transform: rotate(0deg); }
      }
      .orbit-1 { transform-origin: 470px 230px; animation: orbitClockwise 20s linear infinite; }
      .orbit-2 { transform-origin: 470px 230px; animation: orbitCounter 15s linear infinite; }

      /* Pulsing Energy Conduits */
      @keyframes dashMove {
        0% { stroke-dashoffset: 60; }
        100% { stroke-dashoffset: 0; }
      }
      .conduit {
        stroke-dasharray: 6 6;
        animation: dashMove 2s linear infinite;
      }

      /* Core Heartbeat */
      @keyframes corePulse {
        0%, 100% { r: 36px; opacity: 0.85; }
        50% { r: 42px; opacity: 1; }
      }
      .core-circle { animation: corePulse 3s ease-in-out infinite; }

      /* Star twinkle */
      @keyframes twinkle {
        0%, 100% { opacity: 0.2; }
        50% { opacity: 0.9; }
      }
      .st1 { animation: twinkle 2.5s ease-in-out infinite; }
      .st2 { animation: twinkle 3.8s ease-in-out infinite; }
      .st3 { animation: twinkle 1.8s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Deep Space Canvas -->
  <rect width="940" height="460" fill="url(#spaceBg)" rx="8" stroke="#1e293b" stroke-width="1" />

  <!-- Ambient Core Glow -->
  <circle cx="470" cy="230" r="220" fill="url(#coreGlow)" />

  <!-- Subtle Constellation Star Background -->
  <g>
    <circle class="st1" cx="80"  cy="60"  r="1.2" fill="#ffffff" />
    <circle class="st2" cx="160" cy="220" r="1.5" fill="#00f0ff" />
    <circle class="st3" cx="280" cy="50"  r="1.0" fill="#ffffff" />
    <circle class="st1" cx="390" cy="110" r="1.8" fill="#38bdf8" />
    <circle class="st2" cx="540" cy="80"  r="1.2" fill="#ffffff" />
    <circle class="st3" cx="680" cy="60"  r="1.5" fill="#00f0ff" />
    <circle class="st1" cx="860" cy="120" r="1.2" fill="#ffffff" />
    <circle class="st2" cx="100" cy="380" r="1.5" fill="#38bdf8" />
    <circle class="st3" cx="310" cy="410" r="1.2" fill="#ffffff" />
    <circle class="st1" cx="620" cy="390" r="1.6" fill="#00f0ff" />
    <circle class="st2" cx="820" cy="360" r="1.2" fill="#ffffff" />
    <circle class="st3" cx="890" cy="260" r="1.4" fill="#38bdf8" />
  </g>

  <!-- Section Title & Telemetry -->
  <g transform="translate(36, 38)">
    <text class="mono" font-size="11" font-weight="700" fill="#00f0ff" letter-spacing="2.5">SECTION 03 // TECH CONSTELLATION</text>
    <text class="sans" x="0" y="24" font-size="20" font-weight="800" fill="#ffffff" letter-spacing="0.5">INTERCONNECTED TECHNOLOGY ARCHITECTURE</text>
  </g>

  <!-- Dual Counter-Rotating Orbital Rings around Central Core -->
  <g class="orbit-1">
    <ellipse cx="470" cy="230" rx="140" ry="140" fill="none" stroke="#00f0ff" stroke-width="0.8" stroke-dasharray="10 14" opacity="0.35" />
    <circle cx="610" cy="230" r="4" fill="#00f0ff" />
    <circle cx="330" cy="230" r="3" fill="#38bdf8" />
  </g>
  <g class="orbit-2">
    <ellipse cx="470" cy="230" rx="100" ry="100" fill="none" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="6 8" opacity="0.4" />
    <circle cx="470" cy="130" r="3.5" fill="#ffffff" />
    <circle cx="470" cy="330" r="3" fill="#00f0ff" />
  </g>

  <!-- Interconnecting Constellation Lines -->
  <!-- Center to Clusters -->
  <line class="conduit" x1="470" y1="230" x2="200" y2="130" stroke="#00f0ff" stroke-width="1.2" opacity="0.6" />
  <line class="conduit" x1="470" y1="230" x2="200" y2="330" stroke="#38bdf8" stroke-width="1.2" opacity="0.6" />
  <line class="conduit" x1="470" y1="230" x2="740" y2="130" stroke="#00f0ff" stroke-width="1.2" opacity="0.6" />
  <line class="conduit" x1="470" y1="230" x2="740" y2="330" stroke="#38bdf8" stroke-width="1.2" opacity="0.6" />

  <!-- Intra-Cluster Constellation Lines -->
  <!-- Cluster 1: Frontend (Top Left) -->
  <line x1="200" y1="130" x2="110" y2="90"  stroke="#00f0ff" stroke-width="0.8" opacity="0.4" />
  <line x1="200" y1="130" x2="110" y2="170" stroke="#00f0ff" stroke-width="0.8" opacity="0.4" />
  <line x1="200" y1="130" x2="290" y2="90"  stroke="#00f0ff" stroke-width="0.8" opacity="0.4" />
  <line x1="110" y1="90"  x2="290" y2="90"  stroke="#00f0ff" stroke-width="0.5" stroke-dasharray="3 3" opacity="0.3" />

  <!-- Cluster 2: Backend (Bottom Left) -->
  <line x1="200" y1="330" x2="110" y2="290" stroke="#38bdf8" stroke-width="0.8" opacity="0.4" />
  <line x1="200" y1="330" x2="110" y2="370" stroke="#38bdf8" stroke-width="0.8" opacity="0.4" />
  <line x1="200" y1="330" x2="290" y2="370" stroke="#38bdf8" stroke-width="0.8" opacity="0.4" />
  <line x1="110" y1="290" x2="290" y2="370" stroke="#38bdf8" stroke-width="0.5" stroke-dasharray="3 3" opacity="0.3" />

  <!-- Cluster 3: Database & Cloud (Top Right) -->
  <line x1="740" y1="130" x2="650" y2="90"  stroke="#00f0ff" stroke-width="0.8" opacity="0.4" />
  <line x1="740" y1="130" x2="830" y2="90"  stroke="#00f0ff" stroke-width="0.8" opacity="0.4" />
  <line x1="740" y1="130" x2="830" y2="170" stroke="#00f0ff" stroke-width="0.8" opacity="0.4" />
  <line x1="650" y1="90"  x2="830" y2="170" stroke="#00f0ff" stroke-width="0.5" stroke-dasharray="3 3" opacity="0.3" />

  <!-- Cluster 4: AI & Systems (Bottom Right) -->
  <line x1="740" y1="330" x2="650" y2="370" stroke="#38bdf8" stroke-width="0.8" opacity="0.4" />
  <line x1="740" y1="330" x2="830" y2="290" stroke="#38bdf8" stroke-width="0.8" opacity="0.4" />
  <line x1="740" y1="330" x2="830" y2="370" stroke="#38bdf8" stroke-width="0.8" opacity="0.4" />
  <line x1="650" y1="370" x2="830" y2="290" stroke="#38bdf8" stroke-width="0.5" stroke-dasharray="3 3" opacity="0.3" />

  <!-- ================= CENTRAL STAR CORE ================= -->
  <g transform="translate(470, 230)">
    <circle class="core-circle" cx="0" cy="0" r="38" fill="#071228" stroke="#00f0ff" stroke-width="2" />
    <circle cx="0" cy="0" r="48" fill="none" stroke="#00f0ff" stroke-width="0.6" stroke-dasharray="6 6" opacity="0.6" />
    <text text-anchor="middle" y="-6" class="mono" font-size="9" font-weight="700" fill="#00f0ff" letter-spacing="1.5">FULL-STACK</text>
    <text text-anchor="middle" y="10" class="sans" font-size="12" font-weight="900" fill="#ffffff" letter-spacing="1">AI CORE</text>
    <text text-anchor="middle" y="22" class="mono" font-size="7.5" fill="#38bdf8">SHABER-01</text>
  </g>

  <!-- ================= CLUSTER 1: FRONTEND & 3D (Top Left) ================= -->
  <!-- Cluster Header -->
  <rect x="70" y="44" width="160" height="20" rx="3" fill="#0a1224" stroke="#00f0ff" stroke-width="0.6" />
  <text x="150" y="58" text-anchor="middle" class="mono" font-size="8.5" font-weight="700" fill="#00f0ff" letter-spacing="1.5">01 // FRONTEND &amp; 3D</text>

  <!-- Primary Node: React / Next.js -->
  <g transform="translate(200, 130)">
    <circle cx="0" cy="0" r="26" fill="#071024" stroke="#00f0ff" stroke-width="1.8" />
    <circle cx="0" cy="0" r="30" fill="none" stroke="#00f0ff" stroke-width="0.6" opacity="0.5" />
    <text text-anchor="middle" y="4" class="sans" font-size="10.5" font-weight="800" fill="#ffffff">React</text>
    <text text-anchor="middle" y="15" class="mono" font-size="7" fill="#00f0ff">Next.js</text>
  </g>
  <!-- Orbiting Node: TypeScript -->
  <g transform="translate(110, 90)">
    <circle cx="0" cy="0" r="18" fill="#060c1c" stroke="#38bdf8" stroke-width="1.2" />
    <text text-anchor="middle" y="4" class="sans" font-size="9" font-weight="700" fill="#ffffff">TS</text>
  </g>
  <!-- Orbiting Node: Three.js WebGL -->
  <g transform="translate(110, 170)">
    <circle cx="0" cy="0" r="20" fill="#060c1c" stroke="#38bdf8" stroke-width="1.2" />
    <text text-anchor="middle" y="4" class="sans" font-size="8.5" font-weight="700" fill="#ffffff">Three.js</text>
  </g>
  <!-- Orbiting Node: Tailwind CSS -->
  <g transform="translate(290, 90)">
    <circle cx="0" cy="0" r="18" fill="#060c1c" stroke="#38bdf8" stroke-width="1.2" />
    <text text-anchor="middle" y="4" class="sans" font-size="8.5" font-weight="700" fill="#ffffff">Tailwind</text>
  </g>

  <!-- ================= CLUSTER 2: BACKEND & REAL-TIME (Bottom Left) ================= -->
  <!-- Cluster Header -->
  <rect x="70" y="416" width="160" height="20" rx="3" fill="#0a1224" stroke="#38bdf8" stroke-width="0.6" />
  <text x="150" y="430" text-anchor="middle" class="mono" font-size="8.5" font-weight="700" fill="#38bdf8" letter-spacing="1.5">02 // BACKEND &amp; REALTIME</text>

  <!-- Primary Node: Node.js / Express -->
  <g transform="translate(200, 330)">
    <circle cx="0" cy="0" r="26" fill="#071024" stroke="#38bdf8" stroke-width="1.8" />
    <circle cx="0" cy="0" r="30" fill="none" stroke="#38bdf8" stroke-width="0.6" opacity="0.5" />
    <text text-anchor="middle" y="4" class="sans" font-size="10.5" font-weight="800" fill="#ffffff">Node.js</text>
    <text text-anchor="middle" y="15" class="mono" font-size="7" fill="#38bdf8">Express</text>
  </g>
  <!-- Orbiting Node: Socket.IO -->
  <g transform="translate(110, 290)">
    <circle cx="0" cy="0" r="20" fill="#060c1c" stroke="#00f0ff" stroke-width="1.2" />
    <text text-anchor="middle" y="4" class="sans" font-size="8.5" font-weight="700" fill="#ffffff">Socket.IO</text>
  </g>
  <!-- Orbiting Node: REST APIs -->
  <g transform="translate(110, 370)">
    <circle cx="0" cy="0" r="18" fill="#060c1c" stroke="#00f0ff" stroke-width="1.2" />
    <text text-anchor="middle" y="4" class="sans" font-size="9" font-weight="700" fill="#ffffff">REST</text>
  </g>
  <!-- Orbiting Node: WebSockets -->
  <g transform="translate(290, 370)">
    <circle cx="0" cy="0" r="19" fill="#060c1c" stroke="#00f0ff" stroke-width="1.2" />
    <text text-anchor="middle" y="4" class="sans" font-size="8" font-weight="700" fill="#ffffff">WebSocket</text>
  </g>

  <!-- ================= CLUSTER 3: DATABASE & CLOUD (Top Right) ================= -->
  <!-- Cluster Header -->
  <rect x="710" y="44" width="160" height="20" rx="3" fill="#0a1224" stroke="#00f0ff" stroke-width="0.6" />
  <text x="790" y="58" text-anchor="middle" class="mono" font-size="8.5" font-weight="700" fill="#00f0ff" letter-spacing="1.5">03 // DATABASE &amp; CLOUD</text>

  <!-- Primary Node: PostgreSQL -->
  <g transform="translate(740, 130)">
    <circle cx="0" cy="0" r="26" fill="#071024" stroke="#00f0ff" stroke-width="1.8" />
    <circle cx="0" cy="0" r="30" fill="none" stroke="#00f0ff" stroke-width="0.6" opacity="0.5" />
    <text text-anchor="middle" y="4" class="sans" font-size="10.5" font-weight="800" fill="#ffffff">Postgres</text>
    <text text-anchor="middle" y="15" class="mono" font-size="7" fill="#00f0ff">SQL Engine</text>
  </g>
  <!-- Orbiting Node: Supabase -->
  <g transform="translate(650, 90)">
    <circle cx="0" cy="0" r="20" fill="#060c1c" stroke="#38bdf8" stroke-width="1.2" />
    <text text-anchor="middle" y="4" class="sans" font-size="8.5" font-weight="700" fill="#ffffff">Supabase</text>
  </g>
  <!-- Orbiting Node: MongoDB -->
  <g transform="translate(830, 90)">
    <circle cx="0" cy="0" r="19" fill="#060c1c" stroke="#38bdf8" stroke-width="1.2" />
    <text text-anchor="middle" y="4" class="sans" font-size="8.5" font-weight="700" fill="#ffffff">MongoDB</text>
  </g>
  <!-- Orbiting Node: SQLite -->
  <g transform="translate(830, 170)">
    <circle cx="0" cy="0" r="18" fill="#060c1c" stroke="#38bdf8" stroke-width="1.2" />
    <text text-anchor="middle" y="4" class="sans" font-size="9" font-weight="700" fill="#ffffff">SQLite</text>
  </g>

  <!-- ================= CLUSTER 4: AI & SYSTEMS (Bottom Right) ================= -->
  <!-- Cluster Header -->
  <rect x="710" y="416" width="160" height="20" rx="3" fill="#0a1224" stroke="#38bdf8" stroke-width="0.6" />
  <text x="790" y="430" text-anchor="middle" class="mono" font-size="8.5" font-weight="700" fill="#38bdf8" letter-spacing="1.5">04 // AI, EDA &amp; TOOLS</text>

  <!-- Primary Node: Python / AI -->
  <g transform="translate(740, 330)">
    <circle cx="0" cy="0" r="26" fill="#071024" stroke="#38bdf8" stroke-width="1.8" />
    <circle cx="0" cy="0" r="30" fill="none" stroke="#38bdf8" stroke-width="0.6" opacity="0.5" />
    <text text-anchor="middle" y="4" class="sans" font-size="10.5" font-weight="800" fill="#ffffff">Python</text>
    <text text-anchor="middle" y="15" class="mono" font-size="7" fill="#38bdf8">AI / NumPy</text>
  </g>
  <!-- Orbiting Node: PySide6 (Qt) -->
  <g transform="translate(650, 370)">
    <circle cx="0" cy="0" r="20" fill="#060c1c" stroke="#00f0ff" stroke-width="1.2" />
    <text text-anchor="middle" y="4" class="sans" font-size="8.5" font-weight="700" fill="#ffffff">PySide6</text>
  </g>
  <!-- Orbiting Node: Linux -->
  <g transform="translate(830, 290)">
    <circle cx="0" cy="0" r="18" fill="#060c1c" stroke="#00f0ff" stroke-width="1.2" />
    <text text-anchor="middle" y="4" class="sans" font-size="9" font-weight="700" fill="#ffffff">Linux</text>
  </g>
  <!-- Orbiting Node: Git & Docker -->
  <g transform="translate(830, 370)">
    <circle cx="0" cy="0" r="19" fill="#060c1c" stroke="#00f0ff" stroke-width="1.2" />
    <text text-anchor="middle" y="4" class="sans" font-size="8.5" font-weight="700" fill="#ffffff">Git / Hub</text>
  </g>
</svg>