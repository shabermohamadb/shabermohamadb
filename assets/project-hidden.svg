<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 90" width="100%" height="90">
  <defs>
    <linearGradient id="p3Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0E1326" />
      <stop offset="100%" stop-color="#090B14" />
    </linearGradient>
    <style>
      .p-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 16px; font-weight: 800; fill: #FFFFFF; }
      .p-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; fill: #94A3B8; }
      .p-tag { font-family: ui-monospace, monospace; font-size: 10px; font-weight: 600; fill: #BB9AF7; letter-spacing: 1px; }
      @keyframes spinPolygon {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .spin { transform-origin: 0px 0px; animation: spinPolygon 12s linear infinite; }
    </style>
  </defs>

  <rect width="840" height="90" rx="8" fill="url(#p3Grad)" stroke="#1E253E" stroke-width="1" />

  <!-- Animated WebGL Spatial Wireframe (Left) -->
  <g transform="translate(48, 45)">
    <g class="spin">
      <polygon points="0,-16 14,8 -14,8" fill="none" stroke="#BB9AF7" stroke-width="1.2" />
    </g>
    <circle cx="0" cy="0" r="3" fill="#FFFFFF" />
  </g>

  <!-- Project Identity & Description -->
  <g transform="translate(86, 32)">
    <text x="0" y="0" class="p-tag">FEATURED 03 // 3D WEBGL ARENA</text>
    <text x="0" y="20" class="p-title">Hidden Number &#8212; Multiplayer Social Deduction Arena</text>
    <text x="0" y="38" class="p-desc">Real-time party deduction game built around 3D spatial depth and mathematical information veil.</text>
  </g>

  <!-- Right Badges -->
  <g transform="translate(680, 48)">
    <rect width="130" height="26" rx="4" fill="#18152E" stroke="#372E5E" stroke-width="1" />
    <text x="65" y="17" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10.5" font-weight="600" fill="#BB9AF7">Three.js &#8226; WebGL</text>
  </g>
</svg>