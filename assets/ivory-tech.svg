<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 100" width="100%" height="100%">
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace; }

      @keyframes floatIcon {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-3px); }
      }
      .f1 { animation: floatIcon 4s ease-in-out infinite; }
      .f2 { animation: floatIcon 4s ease-in-out infinite 0.6s; }
      .f3 { animation: floatIcon 4s ease-in-out infinite 1.2s; }
      .f4 { animation: floatIcon 4s ease-in-out infinite 1.8s; }
    </style>
  </defs>

  <rect width="940" height="100" fill="#f7f6f2" rx="4" stroke="#e5e3dc" stroke-width="1" />

  <!-- Top Minimalist Folio Label -->
  <text x="36" y="24" class="mono" font-size="9.5" font-weight="700" fill="#71717a" letter-spacing="1.5">CORE TECHNOLOGIES // VERIFIED PRODUCTION STACK</text>

  <!-- Horizontal Clean Icon Row with Official Brand Colors (Clean, uncarded, pure visual) -->
  <g transform="translate(36, 44)">
    <!-- React -->
    <g class="f1" transform="translate(0, 0)">
      <circle cx="16" cy="16" r="16" fill="#ffffff" stroke="#e5e3dc" stroke-width="1" />
      <circle cx="16" cy="16" r="5" fill="#61dafb" />
      <text x="40" y="20" class="sans" font-size="12" font-weight="700" fill="#18181b">React</text>
    </g>

    <!-- Next.js -->
    <g class="f2" transform="translate(120, 0)">
      <circle cx="16" cy="16" r="16" fill="#18181b" />
      <text x="16" y="20" text-anchor="middle" class="sans" font-size="10" font-weight="800" fill="#ffffff">N</text>
      <text x="40" y="20" class="sans" font-size="12" font-weight="700" fill="#18181b">Next.js</text>
    </g>

    <!-- TypeScript -->
    <g class="f3" transform="translate(240, 0)">
      <rect x="0" y="0" width="32" height="32" rx="4" fill="#3178c6" />
      <text x="16" y="21" text-anchor="middle" class="mono" font-size="12" font-weight="800" fill="#ffffff">TS</text>
      <text x="40" y="20" class="sans" font-size="12" font-weight="700" fill="#18181b">TypeScript</text>
    </g>

    <!-- Three.js (WebGL) -->
    <g class="f4" transform="translate(380, 0)">
      <circle cx="16" cy="16" r="16" fill="#ffffff" stroke="#e5e3dc" stroke-width="1" />
      <polygon points="16,8 24,24 8,24" fill="#18181b" />
      <text x="40" y="20" class="sans" font-size="12" font-weight="700" fill="#18181b">Three.js</text>
    </g>

    <!-- Node.js -->
    <g class="f1" transform="translate(500, 0)">
      <circle cx="16" cy="16" r="16" fill="#5fa04e" />
      <text x="40" y="20" class="sans" font-size="12" font-weight="700" fill="#18181b">Node.js</text>
    </g>

    <!-- Socket.IO -->
    <g class="f2" transform="translate(620, 0)">
      <circle cx="16" cy="16" r="16" fill="#18181b" />
      <text x="16" y="20" text-anchor="middle" class="mono" font-size="10" font-weight="800" fill="#ffffff">IO</text>
      <text x="40" y="20" class="sans" font-size="12" font-weight="700" fill="#18181b">Socket.IO</text>
    </g>

    <!-- Python -->
    <g class="f3" transform="translate(750, 0)">
      <circle cx="16" cy="16" r="16" fill="#ffffff" stroke="#e5e3dc" stroke-width="1" />
      <circle cx="16" cy="16" r="6" fill="#3776ab" />
      <text x="40" y="20" class="sans" font-size="12" font-weight="700" fill="#18181b">Python</text>
    </g>
  </g>
</svg>