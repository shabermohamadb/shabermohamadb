    <g transform="translate(18, 66)">
      <rect width="74" height="26" class="pill" />
      <text x="37" y="17" text-anchor="middle" class="pill-text">Python</text>

      <rect x="82" width="76" height="26" class="pill" />
      <text x="120" y="17" text-anchor="middle" class="pill-text">NumPy</text>

      <rect x="166" width="74" height="26" class="pill" />
      <text x="203" y="17" text-anchor="middle" class="pill-text">Pandas</text>
    </g>

    <g transform="translate(18, 102)">
      <rect width="124" height="26" class="pill" />
      <text x="62" y="17" text-anchor="middle" class="pill-text">Machine Learning</text>

      <rect x="132" width="108" height="26" class="pill" />
      <text x="186" y="17" text-anchor="middle" class="pill-text">Scikit-Learn</text>
    </g>
  </g>

