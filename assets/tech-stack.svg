    <text x="18" y="26" class="mono" font-size="9.5" font-weight="600" fill="#38BDF8" letter-spacing="1">LAYER 03</text>
    <text x="18" y="44" class="sans" font-size="13" font-weight="700" fill="#F8FAFC">Database &amp; Storage</text>
    <line x1="18" y1="54" x2="238" y2="54" stroke="#171D2B" stroke-width="1" />

    <g transform="translate(18, 66)">
      <rect width="102" height="26" class="pill" />
      <text x="51" y="17" text-anchor="middle" class="pill-text">PostgreSQL</text>

      <rect x="110" width="88" height="26" class="pill" />
      <text x="154" y="17" text-anchor="middle" class="pill-text">Supabase</text>
    </g>

    <g transform="translate(18, 102)">
