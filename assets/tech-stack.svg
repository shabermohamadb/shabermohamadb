      <text x="152" y="17" text-anchor="middle" class="pill-text">JWT Auth Flow</text>

      <rect x="216" width="144" height="26" class="pill" />
      <text x="288" y="17" text-anchor="middle" class="pill-text">Async Event Loops</text>
