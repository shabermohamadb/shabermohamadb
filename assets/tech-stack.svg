    <g transform="translate(20, 68)">
      <rect width="78" height="26" class="pill" />
      <text x="39" y="17" text-anchor="middle" class="pill-text">Node.js</text>

      <rect x="86" width="94" height="26" class="pill" />
      <text x="133" y="17" text-anchor="middle" class="pill-text">Express.js</text>

      <rect x="188" width="76" height="26" class="pill" />
      <text x="226" y="17" text-anchor="middle" class="pill-text">Python</text>

      <rect x="272" width="88" height="26" class="pill" />
      <text x="316" y="17" text-anchor="middle" class="pill-text">REST APIs</text>
    </g>

    <!-- Pills Row 2 -->
    <g transform="translate(20, 104)">
      <rect width="88" height="26" class="pill" />
