    <g transform="translate(18, 102)">
      <rect width="70" height="26" class="pill" />
      <text x="35" y="17" text-anchor="middle" class="pill-text">Docker</text>

      <rect x="78" width="82" height="26" class="pill" />
      <text x="119" y="17" text-anchor="middle" class="pill-text">VS Code</text>

      <rect x="168" width="56" height="26" class="pill" />
      <text x="196" y="17" text-anchor="middle" class="pill-text">Vite</text>
    </g>
