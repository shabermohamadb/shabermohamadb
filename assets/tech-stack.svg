<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E121B" />
      <stop offset="100%" stop-color="#090B10" />
    </linearGradient>
    <style>
      .mono { font-family: ui-monospace, 'JetBrains Mono', monospace; }
      .sans { font-family: system-ui, -apple-system, 'SF Pro Display', Inter, sans-serif; }
      .pill { fill: #141A26; stroke: #232B3E; stroke-width: 1; rx: 4; }
      .pill-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11.5px; font-weight: 500; fill: #E2E8F0; }
      .badge-accent { fill: #38BDF8; font-size: 10px; font-weight: 700; }
    </style>
  </defs>

  <!-- Container Box -->
  <rect width="900" height="440" rx="12" fill="#08090D" stroke="#1A202E" stroke-width="1" />

  <!-- TOP HEADER -->
  <text x="36" y="38" class="mono" font-size="11" font-weight="600" fill="#38BDF8" letter-spacing="2">// 02 TECHNOLOGY MATRIX</text>
  <text x="36" y="58" class="sans" font-size="18" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">TECHNICAL ARSENAL &amp; SYSTEM PROFICIENCIES</text>
  <line x1="36" y1="72" x2="864" y2="72" stroke="#161B28" stroke-width="1" />

  <!-- COLUMN 1: FRONTEND (Width 400) -->
  <g transform="translate(36, 90)">
    <rect width="400" height="150" rx="8" fill="url(#cardBg)" stroke="#1C2333" stroke-width="1" />
    <text x="20" y="28" class="mono" font-size="10" font-weight="600" fill="#38BDF8" letter-spacing="1">LAYER 01</text>
    <text x="20" y="46" class="sans" font-size="14" font-weight="700" fill="#F8FAFC">Frontend &amp; Interface Engineering</text>
    <line x1="20" y1="56" x2="380" y2="56" stroke="#171D2B" stroke-width="1" />

    <!-- Pills Row 1 -->
    <g transform="translate(20, 68)">
      <rect width="70" height="26" class="pill" />
      <text x="35" y="17" text-anchor="middle" class="pill-text">React</text>

      <rect x="78" width="76" height="26" class="pill" />
      <text x="116" y="17" text-anchor="middle" class="pill-text">Next.js</text>

      <rect x="162" width="94" height="26" class="pill" />
      <text x="209" y="17" text-anchor="middle" class="pill-text">TypeScript</text>

      <rect x="264" width="92" height="26" class="pill" />
      <text x="310" y="17" text-anchor="middle" class="pill-text">JavaScript</text>
    </g>

    <!-- Pills Row 2 -->
    <g transform="translate(20, 104)">
      <rect width="64" height="26" class="pill" />
      <text x="32" y="17" text-anchor="middle" class="pill-text">HTML5</text>

      <rect x="72" width="60" height="26" class="pill" />
      <text x="102" y="17" text-anchor="middle" class="pill-text">CSS3</text>

      <rect x="140" width="104" height="26" class="pill" />
      <text x="192" y="17" text-anchor="middle" class="pill-text">Tailwind CSS</text>

      <rect x="252" width="104" height="26" class="pill" />
      <text x="304" y="17" text-anchor="middle" class="pill-text">Framer Motion</text>
    </g>
  </g>

