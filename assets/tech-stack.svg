      <text x="28" y="17" text-anchor="middle" class="pill-text">Git</text>

      <rect x="64" width="72" height="26" class="pill" />
      <text x="100" y="17" text-anchor="middle" class="pill-text">GitHub</text>

      <rect x="144" width="62" height="26" class="pill" />
      <text x="175" y="17" text-anchor="middle" class="pill-text">Linux</text>
