<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090D" />
      <stop offset="50%" stop-color="#0C0E15" />
      <stop offset="100%" stop-color="#07080B" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="65%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#161A26" stroke-width="0.75" stroke-opacity="0.5" />
    </pattern>

    <style>
      .mono { font-family: ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace; }
      .sans { font-family: system-ui, -apple-system, 'SF Pro Display', Inter, Roboto, sans-serif; }
      
      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.35; transform: scale(1.15); }
      }

      @keyframes scanSweep {
        0% { transform: translateX(-900px); }
        100% { transform: translateX(900px); }
      }

      @keyframes auraDrift {
        0%, 100% { opacity: 0.2; transform: translateY(0); }
        50% { opacity: 0.35; transform: translateY(-8px); }
      }

      .pulse-dot {
        transform-origin: 66px 42px;
        animation: pulse 2.5s ease-in-out infinite;
      }

      .scan-line {
        animation: scanSweep 7s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      .aura-glow {
        animation: auraDrift 5s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="900" height="370" rx="14" fill="url(#bgGrad)" />

  <!-- Subtle Blueprint Grid -->
  <rect width="900" height="370" rx="14" fill="url(#grid)" />

  <!-- Ambient Glow Behind Name -->
  <circle class="aura-glow" cx="450" cy="175" r="150" fill="#38BDF8" opacity="0.1" filter="blur(60px)" />
  <circle class="aura-glow" cx="580" cy="180" r="130" fill="#818CF8" opacity="0.08" filter="blur(50px)" />

  <!-- Outer Architectural Framing -->
  <rect x="1" y="1" width="898" height="368" rx="13" fill="none" stroke="#1A1F2C" stroke-width="1.5" />
  <rect x="18" y="18" width="864" height="334" rx="8" fill="none" stroke="#161B26" stroke-width="1" stroke-dasharray="4 4" />

  <!-- Technical Corner Marks -->
  <path d="M 18 30 L 18 18 L 30 18" fill="none" stroke="#38BDF8" stroke-width="1.5" />
  <path d="M 882 30 L 882 18 L 870 18" fill="none" stroke="#38BDF8" stroke-width="1.5" />
  <path d="M 18 340 L 18 352 L 30 352" fill="none" stroke="#38BDF8" stroke-width="1.5" />
  <path d="M 882 340 L 882 352 L 870 352" fill="none" stroke="#38BDF8" stroke-width="1.5" />

  <!-- TOP TELEMETRY BAR -->
  <!-- Live Signal Beacon -->
  <circle class="pulse-dot" cx="66" cy="42" r="4.5" fill="#10B981" />
  <circle cx="66" cy="42" r="2" fill="#FFFFFF" />
  
  <text x="80" y="46" class="mono" font-size="11" font-weight="600" fill="#10B981" letter-spacing="1.5">SYSTEM ACTIVE</text>
  <text x="195" y="46" class="mono" font-size="11" fill="#475569">//</text>
  <text x="215" y="46" class="mono" font-size="11" fill="#94A3B8" letter-spacing="1">FULL-STACK &amp; AI LAB</text>

  <!-- Geographic Coordinates (Tamil Nadu, India) -->
  <text x="840" y="46" text-anchor="end" class="mono" font-size="11" fill="#94A3B8" letter-spacing="1">13.0827° N, 80.2707° E · INDIA</text>

  <!-- Horizontal Divider -->
  <line x1="36" y1="64" x2="864" y2="64" stroke="#1A202C" stroke-width="1" />

  <!-- HERO TYPOGRAPHY -->
  <text x="450" y="112" text-anchor="middle" class="mono" font-size="11.5" font-weight="600" fill="#38BDF8" letter-spacing="4">
    — FULL-STACK DEVELOPER &amp; AI / DATA SCIENCE —
  </text>

  <!-- Primary Name Headline -->
  <text x="450" y="176" text-anchor="middle" class="sans" font-size="50" font-weight="900" fill="url(#titleGrad)" letter-spacing="3">
    SHABER MOHAMAD B
  </text>

  <!-- Statement / Description Line -->
  <text x="450" y="212" text-anchor="middle" class="sans" font-size="14.5" font-weight="400" fill="#94A3B8" letter-spacing="0.5">
    Engineering production web platforms, real-time architectures &amp; intelligent data systems.
  </text>

  <!-- Dynamic Scanning Hairline -->
  <line x1="36" y1="238" x2="864" y2="238" stroke="#161B28" stroke-width="1" />

  <!-- BOTTOM TELEMETRY STAT BLOCKS -->
  <!-- Block 1 -->
  <g transform="translate(48, 260)">
    <rect width="180" height="66" rx="6" fill="#0D111A" stroke="#1A202E" stroke-width="1" />
    <text x="16" y="24" class="mono" font-size="9" fill="#64748B" letter-spacing="1.5">SPECIALIZATION 01</text>
    <text x="16" y="48" class="sans" font-size="13" font-weight="700" fill="#F1F5F9">Full-Stack Web</text>
    <circle cx="160" cy="33" r="3" fill="#38BDF8" />
  </g>

  <!-- Block 2 -->
  <g transform="translate(244, 260)">
    <rect width="180" height="66" rx="6" fill="#0D111A" stroke="#1A202E" stroke-width="1" />
    <text x="16" y="24" class="mono" font-size="9" fill="#64748B" letter-spacing="1.5">SPECIALIZATION 02</text>
    <text x="16" y="48" class="sans" font-size="13" font-weight="700" fill="#F1F5F9">AI &amp; Data Science</text>
    <circle cx="160" cy="33" r="3" fill="#818CF8" />
  </g>

  <!-- Block 3 -->
  <g transform="translate(440, 260)">
    <rect width="200" height="66" rx="6" fill="#0D111A" stroke="#1A202E" stroke-width="1" />
    <text x="16" y="24" class="mono" font-size="9" fill="#64748B" letter-spacing="1.5">SYSTEM ARCHITECTURE</text>
    <text x="16" y="48" class="sans" font-size="13" font-weight="700" fill="#F1F5F9">Real-Time &amp; Cloud</text>
    <circle cx="180" cy="33" r="3" fill="#C084FC" />
  </g>

  <!-- Block 4 -->
  <g transform="translate(656, 260)">
    <rect width="196" height="66" rx="6" fill="#0D111A" stroke="#1A202E" stroke-width="1" />
    <text x="16" y="24" class="mono" font-size="9" fill="#64748B" letter-spacing="1.5">CODEBASE VOLUME</text>
    <text x="16" y="48" class="sans" font-size="13" font-weight="700" fill="#F1F5F9">30+ Repositories</text>
    <circle cx="176" cy="33" r="3" fill="#10B981" />
  </g>
</svg>