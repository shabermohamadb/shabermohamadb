<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 160" width="100%" height="100%">
  <defs>
    <style>
      .title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        font-size: 38px;
        font-weight: 700;
        fill: #f0f6fc;
        letter-spacing: -0.5px;
      }
      .subtitle {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        font-size: 15px;
        font-weight: 400;
        fill: #8b949e;
        letter-spacing: 0.2px;
      }
      .tag {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
        font-weight: 500;
        fill: #d29922;
        letter-spacing: 1px;
      }
      @keyframes gentlePulse {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.05); }
      }
      .glow {
        transform-origin: 740px 80px;
        animation: gentlePulse 6s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Clean Base (#0d1117 seamlessly blends into GitHub dark mode) -->
  <rect width="840" height="160" rx="10" fill="#0d1117" />
  <rect x="0.5" y="0.5" width="839" height="159" rx="9.5" fill="none" stroke="#21262d" stroke-width="1" />

  <!-- Subtle Minimal Glow -->
  <circle class="glow" cx="740" cy="80" r="100" fill="#d29922" opacity="0.06" filter="blur(40px)" />

  <!-- Content Group -->
  <g transform="translate(48, 44)">
    <text x="0" y="0" class="tag">PORTFOLIO // FULL-STACK &amp; AI</text>
    <text x="0" y="42" class="title">Shaber Mohamad B</text>
    <text x="0" y="74" class="subtitle">Full-Stack Developer &amp; AI &amp; Data Science Student &#8226; Tamil Nadu, India</text>
  </g>

  <!-- Tasteful Minimal Geometric Motif (Right Side) -->
  <g transform="translate(730, 48)">
    <circle cx="28" cy="28" r="26" fill="none" stroke="#21262d" stroke-width="1" />
    <circle cx="28" cy="28" r="14" fill="none" stroke="#30363d" stroke-width="1" />
    <circle cx="28" cy="28" r="3" fill="#d29922" />
  </g>
</svg>