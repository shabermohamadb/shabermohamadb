<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 30" width="100%" height="30">
  <defs>
    <linearGradient id="divMat" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0" />
      <stop offset="50%" stop-color="#0070f3" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0" />
    </linearGradient>
    <style>
      @keyframes conduitFlow {
        0% { stroke-dashoffset: 40; }
        100% { stroke-dashoffset: 0; }
      }
      .c-flow { stroke-dasharray: 4 6; animation: conduitFlow 1.2s linear infinite; }
    </style>
  </defs>

  <line class="c-flow" x1="60" y1="15" x2="880" y2="15" stroke="#00f0ff" stroke-width="1.2" opacity="0.7" />
  <rect x="440" y="8" width="60" height="14" rx="2" fill="#081124" stroke="#00f0ff" stroke-width="0.8" />
  <text x="470" y="18" text-anchor="middle" font-family="ui-monospace, monospace" font-size="7.5" font-weight="700" fill="#00f0ff" letter-spacing="1">FLOW</text>
</svg>