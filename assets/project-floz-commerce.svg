<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 130" width="100%" height="100%">
  <defs>
    <linearGradient id="p2Bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#050a18" />
      <stop offset="100%" stop-color="#080e20" />
    </linearGradient>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; }
      @keyframes dispatchPulse {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.1); }
      }
      .pulse-dot { transform-origin: 820px 65px; animation: dispatchPulse 1.8s ease-in-out infinite; }
      @keyframes flowLine {
        0% { stroke-dashoffset: 40; }
        100% { stroke-dashoffset: 0; }
      }
      .flow-conduit { stroke-dasharray: 4 4; animation: flowLine 1.5s linear infinite; }
    </style>
  </defs>

  <rect width="940" height="130" rx="6" fill="url(#p2Bg)" stroke="#1e293b" stroke-width="1" />
  <rect width="4" height="130" rx="1" fill="#38bdf8" />

  <!-- Left Icon Visual -->
  <g transform="translate(48, 65)">
    <circle cx="0" cy="0" r="26" fill="#0a152e" stroke="#38bdf8" stroke-width="1.2" />
    <!-- Fork & Box Tech Symbol -->
    <path d="M -8 -8 L -8 0 C -8 4 0 6 0 10 L 0 14" fill="none" stroke="#00f0ff" stroke-width="1.5" stroke-linecap="round" />
    <path d="M 8 -8 L 8 0 C 8 4 0 6 0 10" fill="none" stroke="#00f0ff" stroke-width="1.5" stroke-linecap="round" />
    <circle cx="0" cy="-6" r="2" fill="#ffffff" />
  </g>

  <!-- Project Brief -->
  <g transform="translate(98, 30)">
    <text class="mono" font-size="9" font-weight="700" fill="#38bdf8" letter-spacing="1.5">PROJECT 02 // PRODUCTION FOOD COMMERCE</text>
    <text y="22" class="sans" font-size="18" font-weight="800" fill="#ffffff">Floz Food Ordering Engine</text>
    <text y="42" class="sans" font-size="11.5" fill="#94a3b8">
      Commercial food commerce engine &amp; administrative dispatch portal built for A-One Shawarma Spot (Nagercoil) with live tracking.
    </text>
    <text y="64" class="mono" font-size="10" font-weight="600" fill="#00f0ff">
      React &#8226; Vite &#8226; Node.js &#8226; Express &#8226; JWT Auth &#8226; Tailwind CSS
    </text>
  </g>

  <!-- Right Side Interactive Dispatch Pipeline -->
  <g transform="translate(680, 42)">
    <rect width="220" height="46" rx="4" fill="#060d1e" stroke="#1e293b" stroke-width="1" />
    <text x="14" y="16" class="mono" font-size="8" fill="#64748b" letter-spacing="1">DISPATCH PIPELINE</text>
    
    <!-- Step nodes -->
    <circle cx="24" cy="30" r="4" fill="#10b981" />
    <line class="flow-conduit" x1="28" y1="30" x2="80" y2="30" stroke="#00f0ff" stroke-width="1.2" />
    <circle cx="84" cy="30" r="4" fill="#00f0ff" />
    <line class="flow-conduit" x1="88" y1="30" x2="140" y2="30" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="144" cy="30" r="4" fill="#38bdf8" />
    <line class="flow-conduit" x1="148" y1="30" x2="196" y2="30" stroke="#10b981" stroke-width="1.2" />
    <circle class="pulse-dot" cx="200" cy="30" r="5" fill="#10b981" />
  </g>
</svg>