<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 180" width="100%" height="100%">
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace; }

      @keyframes statusStep {
        0%, 30% { fill: #2563eb; }
        35%, 65% { fill: #f59e0b; }
        70%, 100% { fill: #10b981; }
      }
      .step-active { animation: statusStep 6s steps(1) infinite; }
    </style>
  </defs>

  <rect width="940" height="180" fill="#0e0f11" rx="4" stroke="#27272a" stroke-width="1" />

  <!-- Left: Production Order Receipt / Ticket -->
  <g transform="translate(24, 20)">
    <rect width="280" height="140" rx="3" fill="#141518" stroke="#27272a" stroke-width="1" />
    <rect width="280" height="24" rx="3" fill="#1a1b1f" />
    
    <text x="14" y="16" class="mono" font-size="8.5" font-weight="700" fill="#f4f4f5">ORDER TICKET #1042</text>
    <text x="266" y="16" class="mono" font-size="8" fill="#71717a" text-anchor="end">LIVE DISPATCH</text>

    <text x="14" y="44" class="sans" font-size="10" font-weight="700" fill="#f4f4f5">A-One Shawarma Spot (Nagercoil)</text>
    <text x="14" y="58" class="mono" font-size="8" fill="#71717a">Client: Commercial Food Ordering Engine</text>

    <!-- Item lines -->
    <line x1="14" y1="68" x2="266" y2="68" stroke="#27272a" stroke-width="0.8" />
    <text x="14" y="82" class="mono" font-size="8" fill="#a1a1aa">1x Chicken Shawarma Roll</text>
    <text x="266" y="82" class="mono" font-size="8" fill="#f4f4f5" text-anchor="end">&#8377;140</text>
    <text x="14" y="96" class="mono" font-size="8" fill="#a1a1aa">1x Chicken Dum Biryani</text>
    <text x="266" y="96" class="mono" font-size="8" fill="#f4f4f5" text-anchor="end">&#8377;220</text>

    <!-- Total -->
    <line x1="14" y1="106" x2="266" y2="106" stroke="#27272a" stroke-width="0.8" />
    <text x="14" y="122" class="mono" font-size="9" font-weight="700" fill="#f4f4f5">TOTAL PAID (JWT VERIFIED)</text>
    <text x="266" y="122" class="mono" font-size="9" font-weight="700" fill="#10b981" text-anchor="end">&#8377;360</text>
  </g>

  <!-- Right: Dispatch Life Cycle & Architecture -->
  <g transform="translate(330, 24)">
    <text class="mono" font-size="10" font-weight="700" fill="#a1a1aa" letter-spacing="1">PROJECT 02 // PRODUCTION FOOD COMMERCE</text>
    <text y="22" class="sans" font-size="18" font-weight="800" fill="#f4f4f5">Floz Food Ordering &amp; Dispatch Engine</text>
    <text y="42" class="sans" font-size="11.5" fill="#a1a1aa">
      Built for a real restaurant in Nagercoil. Handles menu categorization, instant cart state, JWT customer authentication, and a real-time order tracking dashboard.
    </text>

    <!-- Pipeline Step Indicators -->
    <g transform="translate(0, 68)">
      <line x1="10" y1="14" x2="380" y2="14" stroke="#27272a" stroke-width="1.5" />
      
      <!-- Step 1 -->
      <circle cx="10" cy="14" r="6" fill="#10b981" />
      <text x="10" y="32" class="mono" font-size="8" fill="#a1a1aa">01. ORDER PLACED</text>

      <!-- Step 2 -->
      <circle cx="130" cy="14" r="6" fill="#10b981" />
      <text x="130" y="32" class="mono" font-size="8" fill="#a1a1aa">02. KITCHEN PREP</text>

      <!-- Step 3 -->
      <circle class="step-active" cx="250" cy="14" r="6" />
      <text x="250" y="32" class="mono" font-size="8" fill="#f4f4f5" font-weight="700">03. DISPATCHING</text>

      <!-- Step 4 -->
      <circle cx="380" cy="14" r="6" fill="#27272a" />
      <text x="380" y="32" class="mono" font-size="8" fill="#71717a">04. DELIVERED</text>
    </g>

    <!-- Stack Footnote -->
    <text y="124" class="mono" font-size="9" fill="#71717a">
      STACK: <tspan fill="#f4f4f5">React &#8226; Vite &#8226; Node.js &#8226; Express &#8226; JWT Authentication &#8226; Tailwind CSS</tspan>
    </text>
  </g>
</svg>